[Journal]
Storage=persistent
Compress=yes
SystemMaxUse=512M
SystemKeepFree=2G
SystemMaxFileSize=16M
MaxRetentionSec=14day
MaxFileSec=1h
RuntimeMaxUse=32M
SyncIntervalSec=30s
RateLimitIntervalSec=30s
RateLimitBurst=50000
# Never duplicate application records into the host's ordinary journal/syslog.
ForwardToSyslog=no
ForwardToKMsg=no
ForwardToConsole=no
ForwardToWall=no
