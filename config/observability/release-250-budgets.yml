groups:
  - name: voice-room-release-250
    rules:
      - alert: VoiceRoomHttpErrorBudgetExceeded
        expr: rate(voice_room_api_http_requests_total{status=~"5.."}[5m]) / clamp_min(rate(voice_room_api_http_requests_total[5m]), 0.001) > 0.02
        for: 5m
      - alert: VoiceRoomNotificationQueueDisable
        expr: voice_room_notification_oldest_pending_seconds > 900
        for: 1m
      - alert: VoiceRoomMediaQueueDisable
        expr: voice_room_media_oldest_pending_seconds > 900
        for: 1m
      - alert: VoiceRoomMediaAuthorizationLeak
        expr: increase(voice_room_media_authorization_denial_failures_total[5m]) > 0
        for: 0m
