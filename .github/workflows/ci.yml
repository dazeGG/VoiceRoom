          const fs=require('node:fs'),selection=JSON.parse(fs.readFileSync(process.env.SELECTION));const input={selection,selectionArtifactId:Number(process.env.SELECTION_ARTIFACT_ID),sourceBranch:process.env.SOURCE_BRANCH,sourceSha:process.env.SOURCE_SHA,baseSha:selection.terminalDevelopSha,producerRun:{id:Number(process.env.GITHUB_RUN_ID),runAttempt:Number(process.env.GITHUB_RUN_ATTEMPT),repository:process.env.GITHUB_REPOSITORY,event:'pull_request',headSha:process.env.SOURCE_SHA},requiredGates:['Lint, typecheck & build','Tests','G02 autonomous clean-stack verification'],verification:{chromiumRuns:2,retries:0,teardown:'passed',reportDigest:process.env.REPORT_DIGEST},createdAt:new Date().toISOString()};fs.writeFileSync('g02-f7-input.json',JSON.stringify(input));
