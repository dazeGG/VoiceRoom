name: CI/CD

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
permissions:
  contents: read

# Cancel superseded runs on PRs; never cancel a main run (it may be mid-deploy).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  policy:
    name: Git Flow policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate source branch and Conventional Commit PR title
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          set -euo pipefail
          title_pattern='^(feat|fix|docs|test|refactor|chore|perf|style|build|ci|revert)(\([a-z0-9._/-]+\))?!?: .+'

          if [[ ! "$PR_TITLE" =~ $title_pattern ]]; then
            echo "PR title must follow Conventional Commits, for example: feat(web): add room search"
            exit 1
          fi

          case "$BASE_BRANCH:$HEAD_BRANCH" in
            develop:feature/*|develop:release/*|develop:hotfix/*|develop:main|main:release/*|main:hotfix/*)
              ;;
            *)
              echo "Invalid Git Flow route: $HEAD_BRANCH -> $BASE_BRANCH"
              echo "Expected feature/* -> develop, release/* -> main, or hotfix/* -> main. Back-merges may target develop."
              exit 1
              ;;
          esac

  check:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Admin-capable URL: the API test harness creates and drops a temporary
      # database per integration test, so it needs CREATE DATABASE privileges.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  bootstrap-plan:
    name: G01 bootstrap plan
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (github.head_ref == 'feature/2.5.0-g01-canonical-evidence-bootstrap' || startsWith(github.head_ref, 'feature/2.5.0-g01-postmerge-bootstrap-a'))
    environment: g01-bootstrap-approval-authority
    timeout-minutes: 45
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      SOURCE_BRANCH: ${{ github.head_ref }}
      REVIEWER_CODE_ID: ${{ vars.OMX_G01_CODE_REVIEWER_ID }}
      REVIEWER_ARCHITECT_ID: ${{ vars.OMX_G01_ARCHITECT_ID }}
      REVIEWER_VERIFIER_ID: ${{ vars.OMX_G01_VERIFIER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validate canonical plan and bootstrap contracts
        run: |
          python3 scripts/test/validate_release_250_plan.py docs/RELEASE_2.5.0_PLAN.md docs/RELEASE_2.5.0_TEST_SPEC.md
          node --test scripts/test/g01-release-docs.test.mjs scripts/test/g01-oras-lock.test.mjs
          node --test scripts/test/g01-landed-bootstrap-recovery.test.mjs
          node scripts/evidence/recover-landed-bootstrap.mjs --fixture scripts/test/fixtures/g01-landed-bootstrap-recovery.json --validate-only
          node scripts/evidence/validate-envelope.mjs --fixture bootstrap
          scripts/ci/run-actionlint.sh .github/workflows/ci.yml
          scripts/ci/run-oras.sh version
      - name: Atomically derive current attempt from complete GitHub history and emit F7
        id: f7
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > pr.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > current-run.json
          gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA" > head-commit.json
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=all&per_page=100" --slurp > pr-pages.json
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?per_page=100" --slurp > run-pages.json
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --slurp > artifact-pages.json
          printf 'null\n' > prior-failure.json
          if [[ "$SOURCE_BRANCH" == feature/2.5.0-g01-postmerge-bootstrap-a* ]]; then
            BASE_SHA="$(node -p 'JSON.parse(require("node:fs").readFileSync("pr.json")).base.sha')" SOURCE_BRANCH="$SOURCE_BRANCH" node - <<'NODE'
          const fs=require('node:fs');const all=JSON.parse(fs.readFileSync('artifact-pages.json')).flatMap(p=>p.artifacts),base=process.env.BASE_SHA,current=Number(process.env.SOURCE_BRANCH.match(/-a([0-9]+)$/)[1]);const rows=all.map(a=>({a,m:a.name.match(new RegExp(`^g01-bootstrap-failure-(g01-(?:recovery-)?a([0-9]{2,}))-run-([0-9]+)-attempt-([0-9]+)-head-${base}-phase-(f11|selection)$`))})).filter(x=>x.m&&!x.a.expired&&Number(x.m[2])<current);const max=Math.max(0,...rows.map(x=>Number(x.m[2]))),selected=rows.filter(x=>Number(x.m[2])===max);if(selected.length!==1)throw Error('prior landed failure artifact is not uniquely reconstructable');fs.writeFileSync('prior-artifact-metadata.json',JSON.stringify(selected[0].a));
          NODE
            prior_id="$(node -p 'JSON.parse(require("node:fs").readFileSync("prior-artifact-metadata.json")).id')"; gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$prior_id/zip" > prior-failure.zip; rm -rf /tmp/g01-prior; mkdir /tmp/g01-prior; unzip -q prior-failure.zip -d /tmp/g01-prior
            prior_file="$(find /tmp/g01-prior -maxdepth 1 -type f -name 'bootstrap-failure.*.json')"; test -f "$prior_file"
            PRIOR_FILE="$prior_file" BASE_SHA="$(node -p 'JSON.parse(require("node:fs").readFileSync("pr.json")).base.sha')" node --input-type=module - <<'NODE'
          import fs from 'node:fs';import crypto from 'node:crypto';import {validateBootstrapFailure} from './scripts/evidence/emit-bootstrap-selection.mjs';const bytes=fs.readFileSync(process.env.PRIOR_FILE),failure=validateBootstrapFailure(JSON.parse(bytes));if(failure.terminalDevelopSha!==process.env.BASE_SHA)throw Error('prior failure terminal/base mismatch');fs.writeFileSync('prior-failure.json',JSON.stringify({evidenceId:failure.evidenceId,digest:'sha256:'+crypto.createHash('sha256').update(bytes).digest('hex'),terminalDevelopSha:failure.terminalDevelopSha}));
          NODE
          fi
          node - <<'NODE'
          const fs=require('node:fs');const read=p=>JSON.parse(fs.readFileSync(p));fs.writeFileSync('activation-authority.json',JSON.stringify({repository:process.env.GITHUB_REPOSITORY,pr:read('pr.json'),currentRun:read('current-run.json'),headCommit:read('head-commit.json'),prPages:read('pr-pages.json'),runPages:read('run-pages.json'),artifactPages:read('artifact-pages.json'),paginationComplete:true,observedAt:new Date().toISOString(),priorFailure:read('prior-failure.json')}));
          NODE
          node scripts/evidence/bootstrap-export.mjs --activate-authority activation-authority.json --plan docs/RELEASE_2.5.0_PLAN.md --spec docs/RELEASE_2.5.0_TEST_SPEC.md docs/releases/2.5.0/evidence/bootstrap-attempts.json docs/releases/2.5.0/evidence/bootstrap-landed-recoveries.json > candidate-registry-report.g01.json
          created_at="$(node -p 'JSON.parse(require("node:fs").readFileSync("activation-authority.json")).observedAt')"
          node scripts/evidence/bootstrap-export.mjs --f7 --activate-authority activation-authority.json --plan docs/RELEASE_2.5.0_PLAN.md --spec docs/RELEASE_2.5.0_TEST_SPEC.md --source-sha "$SOURCE_SHA" --source-branch "$SOURCE_BRANCH" --created-at "$created_at" docs/releases/2.5.0/evidence/bootstrap-attempts.json docs/releases/2.5.0/evidence/bootstrap-landed-recoveries.json > f7.json
          attempt_id="$(node -p 'JSON.parse(require("node:fs").readFileSync("f7.json")).attemptId')"
          suffix="$(node -p 'JSON.parse(require("node:fs").readFileSync("f7.json")).evidenceId.slice("ci-bundle.".length)')"
          mv f7.json "ci-bundle.$suffix"
          artifact_name="g01-candidate-$attempt_id-run-$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT-head-$SOURCE_SHA"
          printf 'attempt_id=%s\nartifact_name=%s\nsuffix=%s\n' "$attempt_id" "$artifact_name" "$suffix" >> "$GITHUB_OUTPUT"
          printf 'G01_ATTEMPT_ID=%s\nG01_F7_ARTIFACT_NAME=%s\nG01_SUFFIX=%s\n' "$attempt_id" "$artifact_name" "$suffix" >> "$GITHUB_ENV"
      - name: Persist G01 F7 evidence
        id: f7_upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.f7.outputs.artifact_name }}
          path: |
            ci-bundle.*.json
            candidate-registry-report.g01.json
          if-no-files-found: error
          retention-days: 90
      - name: Await exact-head independent approvals and emit F9
        shell: bash
        run: |
          set -euo pipefail
          for value in "$REVIEWER_CODE_ID" "$REVIEWER_ARCHITECT_ID" "$REVIEWER_VERIFIER_ID"; do [[ "$value" =~ ^[1-9][0-9]*$ ]] || exit 1; done
          test "$REVIEWER_CODE_ID" != "$REVIEWER_ARCHITECT_ID" && test "$REVIEWER_CODE_ID" != "$REVIEWER_VERIFIER_ID" && test "$REVIEWER_ARCHITECT_ID" != "$REVIEWER_VERIFIER_ID"
          for poll in $(seq 1 90); do
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/${{ steps.f7_upload.outputs.artifact-id }}" > f7-metadata.json
            if test "$(node -p 'JSON.parse(require("node:fs").readFileSync("f7-metadata.json")).expired')" = false; then
              gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/${{ steps.f7_upload.outputs.artifact-id }}/zip" > f7.zip
              node -e 'const f=require("node:fs"),c=require("node:crypto"),m=JSON.parse(f.readFileSync("f7-metadata.json")),b=f.readFileSync("f7.zip"),d="sha256:"+c.createHash("sha256").update(b).digest("hex");if(d!==m.digest)throw Error("F7 archive digest mismatch");f.writeFileSync("f7-download-digest.txt",d)'
              rm -rf /tmp/g01-f7; mkdir /tmp/g01-f7; unzip -q f7.zip -d /tmp/g01-f7
              test "$(find /tmp/g01-f7 -maxdepth 1 -type f -name 'ci-bundle.*.json' | wc -l | tr -d ' ')" = 1
              f7_file="$(find /tmp/g01-f7 -maxdepth 1 -type f -name 'ci-bundle.*.json')"
              F7_FILE="$f7_file" node -e 'const f=require("node:fs"),c=require("node:crypto");f.writeFileSync("f7-payload-digest.txt","sha256:"+c.createHash("sha256").update(f.readFileSync(process.env.F7_FILE)).digest("hex"))'
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > f7-run.json
              gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews?per_page=100" --slurp > review-pages.json
              REVIEWER_CODE_ID="$REVIEWER_CODE_ID" REVIEWER_ARCHITECT_ID="$REVIEWER_ARCHITECT_ID" REVIEWER_VERIFIER_ID="$REVIEWER_VERIFIER_ID" node - <<'NODE'
          const fs=require('node:fs');const read=p=>JSON.parse(fs.readFileSync(p));fs.writeFileSync('approval-authority.json',JSON.stringify({pr:read('pr.json'),reviews:read('review-pages.json').flat(),reviewAuthority:{'code-reviewer':Number(process.env.REVIEWER_CODE_ID),architect:Number(process.env.REVIEWER_ARCHITECT_ID),verifier:Number(process.env.REVIEWER_VERIFIER_ID)},observedAt:new Date().toISOString(),repository:process.env.GITHUB_REPOSITORY,f7Artifact:{metadata:read('f7-metadata.json'),run:read('f7-run.json'),downloadDigest:fs.readFileSync('f7-download-digest.txt','utf8'),payloadDigest:fs.readFileSync('f7-payload-digest.txt','utf8'),matchCount:1},candidateReport:read('/tmp/g01-f7/candidate-registry-report.g01.json')}));
          NODE
              if node scripts/evidence/emit-bootstrap-selection.mjs --emit-f9 --f7 "$f7_file" --authority approval-authority.json > approval-envelope.json; then break; fi
            fi
            test "$poll" != 90 || exit 1
            sleep 20
          done
          suffix="$(node -p 'JSON.parse(require("node:fs").readFileSync("approval-envelope.json")).evidenceId.slice("approval-envelope.".length)')"
          mv approval-envelope.json "approval-envelope.$suffix"
          artifact_name="g01-approval-$G01_ATTEMPT_ID-run-$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT-head-$SOURCE_SHA"
          echo "G01_F9_ARTIFACT_NAME=$artifact_name" >> "$GITHUB_ENV"
      - name: Persist immutable G01 F9 from candidate PR run
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.G01_F9_ARTIFACT_NAME }}
          path: approval-envelope.*.json
          if-no-files-found: error
          retention-days: 90

  bootstrap-postmerge:
    name: G01 authenticated post-merge F11
    needs: [check, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      active: ${{ steps.discover.outputs.active }}
      pr_number: ${{ steps.discover.outputs.pr_number }}
      attempt_id: ${{ steps.f11.outputs.attempt_id }}
      premerge_run_id: ${{ steps.f11.outputs.premerge_run_id }}
      premerge_run_attempt: ${{ steps.f11.outputs.premerge_run_attempt }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - id: discover
        name: Locate the unique merged G01 PR from the pushed commit
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" > commit-pulls.json
          node - <<'NODE'
          const fs=require('node:fs');const prs=JSON.parse(fs.readFileSync('commit-pulls.json')).filter(p=>p.merged_at&&p.merge_commit_sha===process.env.GITHUB_SHA&&p.base?.ref==='develop'&&p.base?.repo?.full_name===process.env.GITHUB_REPOSITORY&&p.head?.repo?.full_name===process.env.GITHUB_REPOSITORY&&/^feature\/2\.5\.0-g01-(canonical-evidence-bootstrap|postmerge-bootstrap-a[0-9]{2,})$/.test(p.head?.ref));if(prs.length>1)throw Error('pushed commit maps to multiple G01 PRs');fs.appendFileSync(process.env.GITHUB_OUTPUT,prs.length===0?'active=false\n':`active=true\npr_number=${prs[0].number}\n`);if(prs.length)fs.writeFileSync('pr.json',JSON.stringify(prs[0]));
          NODE
      - id: f11
        name: Deterministically authenticate rerun-safe F7/F9 and emit F11
        if: steps.discover.outputs.active == 'true'
        env:
          PR_NUMBER: ${{ steps.discover.outputs.pr_number }}
        run: |
          set -euo pipefail
          head_sha="$(node -p 'JSON.parse(require("node:fs").readFileSync("pr.json")).head.sha')"; branch="$(node -p 'JSON.parse(require("node:fs").readFileSync("pr.json")).head.ref')"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --slurp > artifact-pages.json
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=pull_request&per_page=100" --slurp > premerge-run-pages.json
          HEAD_SHA="$head_sha" BRANCH="$branch" node - <<'NODE'
          const fs=require('node:fs');const a=JSON.parse(fs.readFileSync('artifact-pages.json')).flatMap(p=>p.artifacts),head=process.env.HEAD_SHA,branch=process.env.BRANCH;const ids=a.map(x=>x.name.match(/g01-(?:candidate|approval|merge|selection|bootstrap-failure)-(g01-(?:recovery-)?a[0-9]{2,})-run-[0-9]+-attempt-[0-9]+-head-([0-9a-f]{40})/)?.slice(1)).filter(Boolean);const exact=[...new Set(ids.filter(x=>x[1]===head).map(x=>x[0]))];let attempt;if(exact.length===1)attempt=exact[0];else if(exact.length>1)throw Error('conflicting attempt identities for landed head');else{const recovery=branch.match(/postmerge-bootstrap-a([0-9]{2,})$/);if(recovery)attempt=`g01-recovery-a${recovery[1]}`;else{const max=Math.max(0,...ids.map(x=>Number(x[0].match(/[0-9]+$/)[0])));attempt=`g01-a${String(max+1).padStart(2,'0')}`;}}fs.writeFileSync('fallback-attempt.txt',attempt);
          NODE
          fallback_attempt="$(cat fallback-attempt.txt)"; printf 'G01_ATTEMPT_ID=%s\nG01_FAILURE_PHASE=F11\n' "$fallback_attempt" >> "$GITHUB_ENV"
          emit_failure() { ATTEMPT_ID="$fallback_attempt" node - <<'NODE'
          const fs=require('node:fs');const p=JSON.parse(fs.readFileSync('pr.json'));const o={schemaVersion:1,release:'2.5.0',status:'G01_LANDED_UNSEALED',attemptId:process.env.ATTEMPT_ID,evidenceId:`bootstrap-failure.${process.env.ATTEMPT_ID}.json`,failedPhase:'F11',baseSha:p.base.sha,parentSha:p.base.sha,terminalDevelopSha:process.env.GITHUB_SHA,headSha:p.head.sha,runId:Number(process.env.GITHUB_RUN_ID),runAttempt:Number(process.env.GITHUB_RUN_ATTEMPT),createdAt:new Date().toISOString(),reason:'post-merge F11 authentication failed closed'};fs.writeFileSync(o.evidenceId,JSON.stringify(o)+'\n');
          NODE
          }
          trap emit_failure ERR
          HEAD_SHA="$head_sha" BRANCH="$branch" node - <<'NODE'
          const fs=require('node:fs');const artifacts=JSON.parse(fs.readFileSync('artifact-pages.json')).flatMap(p=>p.artifacts);const runs=JSON.parse(fs.readFileSync('premerge-run-pages.json')).flatMap(p=>p.workflow_runs);const esc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');const re=new RegExp(`^g01-candidate-(g01-(?:recovery-)?a[0-9]{2,})-run-([1-9][0-9]*)-attempt-([1-9][0-9]*)-head-${esc(process.env.HEAD_SHA)}$`);const candidates=[];for(const a of artifacts){const m=a.name.match(re);if(!m||a.expired)continue;const run=runs.find(r=>r.id===Number(m[2])&&r.run_attempt===Number(m[3])&&r.head_sha===process.env.HEAD_SHA&&r.head_branch===process.env.BRANCH&&r.event==='pull_request'&&r.status==='completed'&&r.conclusion==='success');const approval=`g01-approval-${m[1]}-run-${m[2]}-attempt-${m[3]}-head-${process.env.HEAD_SHA}`;const f9=artifacts.filter(x=>x.name===approval&&!x.expired&&x.workflow_run?.id===run?.id);if(run&&f9.length===1)candidates.push({attemptId:m[1],runId:run.id,runAttempt:run.run_attempt,f7:a,f9:f9[0]});}candidates.sort((a,b)=>b.runAttempt-a.runAttempt||b.runId-a.runId);if(!candidates.length)throw Error('no green exact-head F7/F9 pair');const top=candidates[0];if(candidates[1]&&candidates[1].runAttempt===top.runAttempt&&candidates[1].runId===top.runId)throw Error('ambiguous exact-head F7/F9 pair');fs.writeFileSync('premerge-selection.json',JSON.stringify(top));
          NODE
          attempt_id="$(node -p 'JSON.parse(require("node:fs").readFileSync("premerge-selection.json")).attemptId')"; premerge_run_id="$(node -p 'JSON.parse(require("node:fs").readFileSync("premerge-selection.json")).runId')"; premerge_run_attempt="$(node -p 'JSON.parse(require("node:fs").readFileSync("premerge-selection.json")).runAttempt')"
          printf 'attempt_id=%s\npremerge_run_id=%s\npremerge_run_attempt=%s\n' "$attempt_id" "$premerge_run_id" "$premerge_run_attempt" >> "$GITHUB_OUTPUT"
          test "$attempt_id" = "$fallback_attempt"
          for label in f7 f9; do id="$(LABEL="$label" node -p 'JSON.parse(require("node:fs").readFileSync("premerge-selection.json"))[process.env.LABEL].id')"; gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" > "$label-metadata.json"; gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$label.zip"; mkdir "/tmp/g01-$label"; unzip -q "$label.zip" -d "/tmp/g01-$label"; gh api "repos/$GITHUB_REPOSITORY/actions/runs/$premerge_run_id" > "$label-run.json"; LABEL="$label" node -e 'const f=require("node:fs"),c=require("node:crypto"),m=JSON.parse(f.readFileSync(process.env.LABEL+"-metadata.json")),b=f.readFileSync(process.env.LABEL+".zip"),d="sha256:"+c.createHash("sha256").update(b).digest("hex");if(d!==m.digest)throw Error("archive digest mismatch");f.writeFileSync(process.env.LABEL+"-download-digest.txt",d)'; done
          f7_file="$(find /tmp/g01-f7 -maxdepth 1 -type f -name 'ci-bundle.*.json')"; f9_file="$(find /tmp/g01-f9 -maxdepth 1 -type f -name 'approval-envelope.*.json')"; test -f "$f7_file" && test -f "$f9_file"
          F7_FILE="$f7_file" F9_FILE="$f9_file" node -e 'const f=require("node:fs"),c=require("node:crypto");for(const [l,k] of [["f7","F7_FILE"],["f9","F9_FILE"]])f.writeFileSync(l+"-payload-digest.txt","sha256:"+c.createHash("sha256").update(f.readFileSync(process.env[k])).digest("hex"))'
          gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/develop" > develop-ref.json; gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > postmerge-run-raw.json; gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" --slurp > postmerge-job-pages.json
          encoded="$(node -p 'encodeURIComponent(process.argv[1])' "$branch")"; status="$(curl --proto '=https' --tlsv1.2 -sS -o source-ref.json -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/$encoded")"; test "$status" = 404
          SOURCE_REF_STATUS="$status" node - <<'NODE'
          const fs=require('node:fs');const read=p=>JSON.parse(fs.readFileSync(p));const raw=read('postmerge-run-raw.json'),all=read('postmerge-job-pages.json').flatMap(p=>p.jobs),names=['Lint, typecheck & build','Tests'];const requiredJobs=names.map(name=>{const m=all.filter(j=>j.name===name);if(m.length!==1||m[0].status!=='completed'||m[0].conclusion!=='success'||m[0].run_id!==raw.id||m[0].run_attempt!==raw.run_attempt||m[0].head_sha!==raw.head_sha)throw Error(`required job ${name} not exact green`);return{id:m[0].id,name,status:m[0].status,conclusion:m[0].conclusion,runId:m[0].run_id,runAttempt:m[0].run_attempt,headSha:m[0].head_sha}});const postMergeRun={id:raw.id,runAttempt:raw.run_attempt,checkSuiteId:raw.check_suite_id,workflowId:raw.workflow_id,workflowName:raw.name,workflowPath:raw.path,repository:raw.repository.full_name,event:raw.event,headBranch:raw.head_branch,headSha:raw.head_sha,requiredJobs};const artifact=l=>({metadata:read(`${l}-metadata.json`),run:read(`${l}-run.json`),downloadDigest:fs.readFileSync(`${l}-download-digest.txt`,'utf8'),payloadDigest:fs.readFileSync(`${l}-payload-digest.txt`,'utf8'),matchCount:1});fs.writeFileSync('merge-authority.json',JSON.stringify({pr:read('pr.json'),developRef:read('develop-ref.json'),sourceRefStatus:Number(process.env.SOURCE_REF_STATUS),postMergeRun,observedAt:new Date().toISOString(),repository:process.env.GITHUB_REPOSITORY,f7Artifact:artifact('f7'),f9Artifact:artifact('f9')}));
          NODE
          node scripts/evidence/emit-bootstrap-selection.mjs --emit-f11 --f7 "$f7_file" --f9 "$f9_file" --authority merge-authority.json > merge-envelope.json
