          NODE
      - name: Persist immutable authenticated artifactless failure authority
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.G01_BACKFILL_NAME }}
          path: |
            bootstrap-failure.*.json
            bootstrap-failure-backfill-authority.*.json
          if-no-files-found: error
          retention-days: 90

  policy:
    name: Git Flow policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate source branch and Conventional Commit PR title
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          set -euo pipefail
          title_pattern='^(feat|fix|docs|test|refactor|chore|perf|style|build|ci|revert)(\([a-z0-9._/-]+\))?!?: .+'

          if [[ ! "$PR_TITLE" =~ $title_pattern ]]; then
            echo "PR title must follow Conventional Commits, for example: feat(web): add room search"
            exit 1
          fi

          case "$BASE_BRANCH:$HEAD_BRANCH" in
            develop:feature/*|develop:release/*|develop:hotfix/*|develop:main|main:release/*|main:hotfix/*)
              ;;
            *)
              echo "Invalid Git Flow route: $HEAD_BRANCH -> $BASE_BRANCH"
              echo "Expected feature/* -> develop, release/* -> main, or hotfix/* -> main. Back-merges may target develop."
              exit 1
              ;;
          esac

  check:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Admin-capable URL: the API test harness creates and drops a temporary
      # database per integration test, so it needs CREATE DATABASE privileges.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  voice-join:
    name: Voice room join smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start production-like voice stack
        run: docker compose -f docker-compose.ci.yml up -d --build --wait --wait-timeout 180
      - name: Join a room through the public LiveKit gate
        run: npm --workspace @voice-room/web run e2e -- e2e/room-voice.spec.ts --project=chromium --retries=0
      - name: Capture voice stack diagnostics
        if: failure()
        run: |
          docker compose -f docker-compose.ci.yml ps
          docker compose -f docker-compose.ci.yml logs --no-color --tail=250
      - name: Always tear down the voice stack
        if: always()
        run: docker compose -f docker-compose.ci.yml down --volumes --remove-orphans

  goal-g05:
    name: G05 strict LiveKit gate proof
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm --workspace @voice-room/api run test:g05
      - run: G05_SELECTED_MECHANISM=external-auth-gate node scripts/lkv/run-strict-boundary-proof.mjs --json --fail-on-blocked

  goal-g08:
    name: G08 measured coverage gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    permissions:
      contents: read
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Capture protected-base coverage policy and changed files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p coverage
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > coverage/release-250-changed-files.txt
          git diff --unified=0 "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > coverage/release-250-changed.diff
          if git cat-file -e "${{ github.event.pull_request.base.sha }}:config/coverage/release-250-thresholds.json"; then
            git show "${{ github.event.pull_request.base.sha }}:config/coverage/release-250-thresholds.json" > coverage/release-250-base-thresholds.json
            echo "G08_BASELINE_ARGS=--base-thresholds coverage/release-250-base-thresholds.json" >> "$GITHUB_ENV"
          else
            echo "G08_BASELINE_ARGS=--base-thresholds-absent" >> "$GITHUB_ENV"
          fi
      - run: npm run coverage:g08
      - name: Enforce G08 coverage and protected-base ratchet
        shell: bash
        run: |
          read -r -a baseline_args <<< "$G08_BASELINE_ARGS"
          node scripts/coverage/check-release-250-coverage.mjs \
            --coverage coverage/release-250-summary.json \
            --changed-files coverage/release-250-changed-files.txt \
            --changed-diff coverage/release-250-changed.diff \
            "${baseline_args[@]}"
      - name: Persist G08 measured coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: g08-release-250-coverage-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}-head-${{ github.event.pull_request.head.sha }}
          path: |
            coverage/release-250-summary.json
            coverage/release-250-changed-files.txt
            coverage/release-250-changed.diff
            coverage/release-250-base-thresholds.json
          if-no-files-found: error
          retention-days: 90

  bootstrap-plan:
    name: G01 targeted bootstrap gate
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (github.head_ref == 'feature/2.5.0-g01-canonical-evidence-bootstrap' || startsWith(github.head_ref, 'feature/2.5.0-g01-postmerge-bootstrap-a'))
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run exact targeted G01 command catalog and produce reports
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir reports
          python3 scripts/test/validate_release_250_plan.py docs/RELEASE_2.5.0_PLAN.md docs/RELEASE_2.5.0_TEST_SPEC.md > reports/validate-release-plan.log 2>&1
          node --test scripts/test/g01-release-docs.test.mjs scripts/test/g01-oras-lock.test.mjs > reports/g01-release-docs.tap 2>&1
          node --test scripts/test/g01-landed-bootstrap-recovery.test.mjs > reports/g01-landed-bootstrap-recovery.tap 2>&1
          node scripts/evidence/recover-landed-bootstrap.mjs --fixture scripts/test/fixtures/g01-landed-bootstrap-recovery.json --validate-only > reports/recovery-command.log 2>&1
          node scripts/evidence/validate-envelope.mjs --fixture bootstrap > reports/envelope-schema.log 2>&1
          scripts/ci/run-actionlint.sh .github/workflows/ci.yml > reports/actionlint.log 2>&1
          scripts/ci/run-oras.sh version > reports/oras.log 2>&1
          node - <<'NODE'
          const fs=require('node:fs'),c=require('node:crypto'),producedAt=new Date().toISOString(),files=fs.readdirSync('reports').sort().map(name=>{const path=`reports/${name}`,bytes=fs.readFileSync(path);return{path,size:bytes.length,sha256:'sha256:'+c.createHash('sha256').update(bytes).digest('hex')}});fs.writeFileSync('reports/report-manifest.json',JSON.stringify({schemaVersion:1,producer:{jobName:'G01 targeted bootstrap gate',runId:Number(process.env.GITHUB_RUN_ID),runAttempt:Number(process.env.GITHUB_RUN_ATTEMPT),headSha:process.env.SOURCE_SHA,producedAt},files}));
          NODE
      - name: Persist targeted G01 reports for the seal
        uses: actions/upload-artifact@v4
        with:
          name: g01-targeted-reports-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}-head-${{ env.SOURCE_SHA }}
          path: reports/
          if-no-files-found: error
          retention-days: 90

  bootstrap-seal:
    name: G01 authenticated F7/F8/F9 seal
    needs: [policy, check, test, bootstrap-plan]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (github.head_ref == 'feature/2.5.0-g01-canonical-evidence-bootstrap' || startsWith(github.head_ref, 'feature/2.5.0-g01-postmerge-bootstrap-a'))
    environment: g01-bootstrap-approval-authority
    timeout-minutes: 45
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      SOURCE_BRANCH: ${{ github.head_ref }}
      REVIEW_TRANSPORT_ACTOR_ID: ${{ vars.OMX_G01_REVIEW_TRANSPORT_ACTOR_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Download exact targeted G01 reports
        uses: actions/download-artifact@v4
        with:
          name: g01-targeted-reports-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}-head-${{ env.SOURCE_SHA }}
          path: targeted-evidence
      - name: Atomically derive current attempt from complete GitHub history and emit F7
        id: f7
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > pr.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > current-run.json
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" --slurp > current-job-pages.json
          check_suite_id="$(node -p 'JSON.parse(require("node:fs").readFileSync("current-run.json")).check_suite_id')"
          gh api "repos/$GITHUB_REPOSITORY/check-suites/$check_suite_id" > current-check-suite.json
          gh api --paginate "repos/$GITHUB_REPOSITORY/check-suites/$check_suite_id/check-runs?filter=all&per_page=100" --slurp > current-check-run-pages.json
          gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA" > head-commit.json
          BASE_SHA="$(node -p 'JSON.parse(require("node:fs").readFileSync("pr.json")).base.sha')"
          gh api "repos/$GITHUB_REPOSITORY/commits/$BASE_SHA" > base-commit.json
          HEAD_TREE_SHA="$(SOURCE_SHA="$SOURCE_SHA" node -p 'const x=JSON.parse(require("node:fs").readFileSync("head-commit.json"));if(x.sha!==process.env.SOURCE_SHA||!/^[0-9a-f]{40}$/.test(x.commit?.tree?.sha??""))throw Error("authenticated head commit identity mismatch");x.commit.tree.sha')"
          BASE_TREE_SHA="$(BASE_SHA="$BASE_SHA" node -p 'const x=JSON.parse(require("node:fs").readFileSync("base-commit.json"));if(x.sha!==process.env.BASE_SHA||!/^[0-9a-f]{40}$/.test(x.commit?.tree?.sha??""))throw Error("authenticated base commit identity mismatch");x.commit.tree.sha')"
          gh api "repos/$GITHUB_REPOSITORY/git/trees/$HEAD_TREE_SHA?recursive=1" > head-tree.json
          gh api "repos/$GITHUB_REPOSITORY/git/trees/$BASE_TREE_SHA?recursive=1" > base-tree.json
          node --input-type=module -e 'import { G01_WRITABLE } from "./scripts/evidence/recover-landed-bootstrap.mjs"; for (const path of G01_WRITABLE) console.log(path)' > g01-head-blob-paths.txt
          : > head-blobs.ndjson
          while IFS= read -r path; do
