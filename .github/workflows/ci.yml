name: CI/CD

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
permissions:
  contents: read

# Cancel superseded runs on PRs; never cancel a main run (it may be mid-deploy).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  policy:
    name: Git Flow policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate source branch and Conventional Commit PR title
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          set -euo pipefail
          title_pattern='^(feat|fix|docs|test|refactor|chore|perf|style|build|ci|revert)(\([a-z0-9._/-]+\))?!?: .+'

          if [[ ! "$PR_TITLE" =~ $title_pattern ]]; then
            echo "PR title must follow Conventional Commits, for example: feat(web): add room search"
            exit 1
          fi

          case "$BASE_BRANCH:$HEAD_BRANCH" in
            develop:feature/*|develop:release/*|develop:hotfix/*|develop:main|main:release/*|main:hotfix/*)
              ;;
            *)
              echo "Invalid Git Flow route: $HEAD_BRANCH -> $BASE_BRANCH"
              echo "Expected feature/* -> develop, release/* -> main, or hotfix/* -> main. Back-merges may target develop."
              exit 1
              ;;
          esac

  check:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Admin-capable URL: the API test harness creates and drops a temporary
      # database per integration test, so it needs CREATE DATABASE privileges.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  bootstrap-plan:
    name: G01 bootstrap plan
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (github.head_ref == 'feature/2.5.0-g01-canonical-evidence-bootstrap' || startsWith(github.head_ref, 'feature/2.5.0-g01-postmerge-bootstrap-a'))
    environment: g01-bootstrap-approval-authority
    timeout-minutes: 45
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      SOURCE_BRANCH: ${{ github.head_ref }}
      REVIEWER_CODE_ID: ${{ vars.OMX_G01_CODE_REVIEWER_ID }}
      REVIEWER_ARCHITECT_ID: ${{ vars.OMX_G01_ARCHITECT_ID }}
      REVIEWER_VERIFIER_ID: ${{ vars.OMX_G01_VERIFIER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validate canonical plan and bootstrap contracts
        run: |
          python3 scripts/test/validate_release_250_plan.py docs/RELEASE_2.5.0_PLAN.md docs/RELEASE_2.5.0_TEST_SPEC.md
          node --test scripts/test/g01-release-docs.test.mjs scripts/test/g01-oras-lock.test.mjs
          node --test scripts/test/g01-landed-bootstrap-recovery.test.mjs
          node scripts/evidence/recover-landed-bootstrap.mjs --fixture scripts/test/fixtures/g01-landed-bootstrap-recovery.json --validate-only
          node scripts/evidence/validate-envelope.mjs --fixture bootstrap
          scripts/ci/run-actionlint.sh .github/workflows/ci.yml
          scripts/ci/run-oras.sh version
      - name: Atomically derive current attempt from complete GitHub history and emit F7
        id: f7
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > pr.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > current-run.json
          gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA" > head-commit.json
          BASE_SHA="$(node -p 'JSON.parse(require("node:fs").readFileSync("pr.json")).base.sha')"
          gh api "repos/$GITHUB_REPOSITORY/git/trees/$SOURCE_SHA?recursive=1" > head-tree.json
          gh api "repos/$GITHUB_REPOSITORY/git/trees/$BASE_SHA?recursive=1" > base-tree.json
          node --input-type=module -e 'import { G01_WRITABLE } from "./scripts/evidence/recover-landed-bootstrap.mjs"; for (const path of G01_WRITABLE) console.log(path)' > g01-head-blob-paths.txt
          : > head-blobs.ndjson
          while IFS= read -r path; do
            blob_sha="$(PATH_NAME="$path" node -p 'JSON.parse(require("node:fs").readFileSync("head-tree.json")).tree.find(x=>x.path===process.env.PATH_NAME&&x.type==="blob")?.sha||""')"; test -n "$blob_sha"
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$blob_sha" > head-blob.json
            PATH_NAME="$path" BLOB_SHA="$blob_sha" node - <<'NODE' >> head-blobs.ndjson
          const fs=require('node:fs'),c=require('node:crypto'),blob=JSON.parse(fs.readFileSync('head-blob.json')),content=String(blob.content).replace(/\s/g,''),bytes=Buffer.from(content,'base64');if(blob.sha!==process.env.BLOB_SHA)throw Error('blob SHA substitution');process.stdout.write(JSON.stringify({path:process.env.PATH_NAME,sha:blob.sha,sha256:'sha256:'+c.createHash('sha256').update(bytes).digest('hex'),size:bytes.length,encoding:'base64',content})+'\n');
          NODE
          done < g01-head-blob-paths.txt
          node -e 'const f=require("node:fs"),s=f.readFileSync("head-blobs.ndjson","utf8").trim();f.writeFileSync("head-blobs.json",JSON.stringify(s?s.split("\n").map(JSON.parse):[]))'
          attempt_id="$(node -p 'JSON.parse(require("node:fs").readFileSync("docs/releases/2.5.0/evidence/bootstrap-attempts.json")).preparedAuthority.attemptId')"
          gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA/statuses" > publication-statuses.json
          ATTEMPT_ID="$attempt_id" node -e 'const f=require("node:fs"),rows=JSON.parse(f.readFileSync("publication-statuses.json")),context="g01/PUBLICATION/"+process.env.ATTEMPT_ID,match=rows.filter(x=>x.context===context);if(match.length!==1)throw Error("unique immutable publication status absent");f.writeFileSync("publication-status.json",JSON.stringify({...match[0],headSha:process.env.SOURCE_SHA}))'
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=all&per_page=100" --slurp > pr-pages.json
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?per_page=100" --slurp > run-pages.json
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --slurp > artifact-pages.json
          printf 'null\n' > prior-failure.json
          if [[ "$SOURCE_BRANCH" == feature/2.5.0-g01-postmerge-bootstrap-a* ]]; then
            BASE_SHA="$(node -p 'JSON.parse(require("node:fs").readFileSync("pr.json")).base.sha')" SOURCE_BRANCH="$SOURCE_BRANCH" node - <<'NODE'
          const fs=require('node:fs');const all=JSON.parse(fs.readFileSync('artifact-pages.json')).flatMap(p=>p.artifacts),base=process.env.BASE_SHA,current=Number(process.env.SOURCE_BRANCH.match(/-a([0-9]+)$/)[1]);const rows=all.map(a=>({a,m:a.name.match(new RegExp(`^g01-bootstrap-failure-(g01-(?:recovery-)?a([0-9]{2,}))-run-([0-9]+)-attempt-([0-9]+)-head-${base}-phase-(f11|selection)$`))})).filter(x=>x.m&&!x.a.expired&&Number(x.m[2])<current);const max=Math.max(0,...rows.map(x=>Number(x.m[2]))),selected=rows.filter(x=>Number(x.m[2])===max).map(x=>x.a);if(!selected.length)throw Error('prior landed failure artifact is absent');fs.writeFileSync('prior-artifact-candidates.json',JSON.stringify({ordinal:max,artifacts:selected}));
          NODE
            : > prior-records.ndjson
            candidate_count="$(node -p 'JSON.parse(require("node:fs").readFileSync("prior-artifact-candidates.json")).artifacts.length')"
            for index in $(seq 0 $((candidate_count-1))); do
              INDEX="$index" node -e 'const f=require("node:fs"),x=JSON.parse(f.readFileSync("prior-artifact-candidates.json")).artifacts[Number(process.env.INDEX)];f.writeFileSync("prior-artifact-metadata.json",JSON.stringify(x))'
              prior_id="$(node -p 'JSON.parse(require("node:fs").readFileSync("prior-artifact-metadata.json")).id')"; gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$prior_id/zip" > prior-failure.zip; rm -rf /tmp/g01-prior; mkdir /tmp/g01-prior; unzip -q prior-failure.zip -d /tmp/g01-prior
              prior_file="$(find /tmp/g01-prior -maxdepth 1 -type f -name 'bootstrap-failure.*.json')"; test -f "$prior_file"; run_id="$(node -p 'JSON.parse(require("node:fs").readFileSync("prior-artifact-metadata.json")).workflow_run.id')"; gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > prior-run.json
              PRIOR_FILE="$prior_file" node --input-type=module - <<'NODE' >> prior-records.ndjson
          import fs from 'node:fs';import crypto from 'node:crypto';import {validateBootstrapFailure} from './scripts/evidence/emit-bootstrap-selection.mjs';const bytes=fs.readFileSync(process.env.PRIOR_FILE),failure=validateBootstrapFailure(JSON.parse(bytes)),metadata=JSON.parse(fs.readFileSync('prior-artifact-metadata.json')),archive=fs.readFileSync('prior-failure.zip');const archiveDigest='sha256:'+crypto.createHash('sha256').update(archive).digest('hex');if(archiveDigest!==metadata.digest)throw Error('prior failure archive digest mismatch');process.stdout.write(JSON.stringify({failure,artifactId:metadata.id,artifactName:metadata.name,artifactCreatedAt:metadata.created_at,archiveDigest,payloadDigest:'sha256:'+crypto.createHash('sha256').update(bytes).digest('hex'),run:JSON.parse(fs.readFileSync('prior-run.json'))})+'\n');
          NODE
            done
            BASE_SHA="$(node -p 'JSON.parse(require("node:fs").readFileSync("pr.json")).base.sha')" node --input-type=module - <<'NODE'
          import fs from 'node:fs';import {selectCanonicalFailure} from './scripts/evidence/emit-bootstrap-selection.mjs';const input=JSON.parse(fs.readFileSync('prior-artifact-candidates.json')),records=fs.readFileSync('prior-records.ndjson','utf8').trim().split('\n').map(JSON.parse),winner=selectCanonicalFailure(records,input.ordinal,process.env.BASE_SHA,process.env.GITHUB_REPOSITORY),failure=winner.failure,run=winner.run;fs.writeFileSync('prior-failure.json',JSON.stringify({evidenceId:failure.evidenceId,digest:winner.payloadDigest,artifactId:winner.artifactId,artifactName:winner.artifactName,artifactCreatedAt:winner.artifactCreatedAt,archiveDigest:winner.archiveDigest,runId:run.id,runAttempt:run.run_attempt,workflowName:run.name,workflowPath:run.path,repository:run.repository.full_name,event:run.event,headBranch:run.head_branch,headSha:run.head_sha,status:run.status,conclusion:run.conclusion,terminalDevelopSha:failure.terminalDevelopSha,payload:failure,recoveryLineage:failure.recoveryLineage}));
          NODE
          fi
          node -e 'const f=require("node:fs"),a=JSON.parse(f.readFileSync("docs/releases/2.5.0/evidence/bootstrap-attempts.json")).preparedAuthority?.replayRecord?.abandonmentAuthorities??[];f.writeFileSync("prepared-abandonments.json",JSON.stringify(a))'
          : > activation-abandonments.ndjson
          abandonment_count="$(node -p 'JSON.parse(require("node:fs").readFileSync("prepared-abandonments.json")).length')"
          if test "$abandonment_count" -gt 0; then
            for index in $(seq 0 $((abandonment_count-1))); do
              head_sha="$(INDEX="$index" node -p 'JSON.parse(require("node:fs").readFileSync("prepared-abandonments.json"))[Number(process.env.INDEX)].record.headSha')"; gh api "repos/$GITHUB_REPOSITORY/commits/$head_sha/statuses" > abandonment-statuses.json
              INDEX="$index" node - <<'NODE' >> activation-abandonments.ndjson
          const fs=require('node:fs'),expected=JSON.parse(fs.readFileSync('prepared-abandonments.json'))[Number(process.env.INDEX)],rows=JSON.parse(fs.readFileSync('abandonment-statuses.json')),status=rows.find(x=>x.id===expected.status.id);if(!status)throw Error('immutable abandonment status disappeared');process.stdout.write(JSON.stringify({record:expected.record,digest:expected.digest,status:{...status,headSha:expected.record.headSha}})+'\n');
          NODE
            done
          fi
          node -e 'const f=require("node:fs"),s=f.readFileSync("activation-abandonments.ndjson","utf8").trim();f.writeFileSync("activation-abandonments.json",JSON.stringify(s?s.split("\n").map(JSON.parse):[]))'
          printf '[]\n' > premerge-ancestor-authorities.json
          if [[ "$SOURCE_BRANCH" == feature/2.5.0-g01-postmerge-bootstrap-a* ]]; then
            node - <<'NODE'
          const fs=require('node:fs'),prior=JSON.parse(fs.readFileSync('prior-failure.json')),rows=[...prior.recoveryLineage.map(x=>({evidenceId:x.priorFailureId,digest:x.priorFailureDigest})),{evidenceId:prior.evidenceId,digest:prior.digest}],unique=[];for(const row of rows)if(!unique.some(x=>x.evidenceId===row.evidenceId)){if(!/^bootstrap-failure\.g01-(?:a|recovery-a)[0-9]{2,}\.json$/.test(row.evidenceId)||!/^sha256:[0-9a-f]{64}$/.test(row.digest))throw Error('ancestor identity is malformed');unique.push(row)}fs.writeFileSync('premerge-ancestor-expected.json',JSON.stringify(unique));
          NODE
            : > premerge-ancestor-authorities.ndjson
            ancestor_count="$(node -p 'JSON.parse(require("node:fs").readFileSync("premerge-ancestor-expected.json")).length')"
            for index in $(seq 0 $((ancestor_count-1))); do
              INDEX="$index" node - <<'NODE'
          const fs=require('node:fs'),all=JSON.parse(fs.readFileSync('artifact-pages.json')).flatMap(p=>p.artifacts),e=JSON.parse(fs.readFileSync('premerge-ancestor-expected.json'))[Number(process.env.INDEX)],attempt=e.evidenceId.slice('bootstrap-failure.'.length,-'.json'.length),re=new RegExp(`^g01-bootstrap-failure-${attempt}-run-([1-9][0-9]*)-attempt-([1-9][0-9]*)-head-([0-9a-f]{40})-phase-(f11|selection)$`),rows=all.filter(a=>re.test(a.name)&&!a.expired);if(!rows.length)throw Error(`premerge ancestor artifact absent: ${e.evidenceId}`);fs.writeFileSync('premerge-ancestor-candidates.json',JSON.stringify(rows));
          NODE
              matched=false; candidates="$(node -p 'JSON.parse(require("node:fs").readFileSync("premerge-ancestor-candidates.json")).length')"
              for candidate in $(seq 0 $((candidates-1))); do
                artifact_id="$(INDEX="$candidate" node -p 'JSON.parse(require("node:fs").readFileSync("premerge-ancestor-candidates.json"))[Number(process.env.INDEX)].id')"; gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > premerge-ancestor.zip; rm -rf /tmp/g01-premerge-ancestor; mkdir /tmp/g01-premerge-ancestor; unzip -q premerge-ancestor.zip -d /tmp/g01-premerge-ancestor
                evidence="$(INDEX="$index" node -p 'JSON.parse(require("node:fs").readFileSync("premerge-ancestor-expected.json"))[Number(process.env.INDEX)].evidenceId')"; test -f "/tmp/g01-premerge-ancestor/$evidence" || continue
                expected="$(INDEX="$index" node -p 'JSON.parse(require("node:fs").readFileSync("premerge-ancestor-expected.json"))[Number(process.env.INDEX)].digest')"; actual="sha256:$(sha256sum "/tmp/g01-premerge-ancestor/$evidence" | cut -d' ' -f1)"; test "$actual" = "$expected" || continue
                INDEX="$candidate" node -e 'const f=require("node:fs");f.writeFileSync("premerge-ancestor-metadata.json",JSON.stringify(JSON.parse(f.readFileSync("premerge-ancestor-candidates.json"))[Number(process.env.INDEX)]))'; run_id="$(node -p 'JSON.parse(require("node:fs").readFileSync("premerge-ancestor-metadata.json")).workflow_run.id')"; gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > premerge-ancestor-run.json
                EVIDENCE="/tmp/g01-premerge-ancestor/$evidence" EXPECTED_DIGEST="$expected" node --input-type=module - <<'NODE' >> premerge-ancestor-authorities.ndjson
          import fs from 'node:fs';import crypto from 'node:crypto';import {validateBootstrapFailure} from './scripts/evidence/emit-bootstrap-selection.mjs';const bytes=fs.readFileSync(process.env.EVIDENCE),failure=validateBootstrapFailure(JSON.parse(bytes)),metadata=JSON.parse(fs.readFileSync('premerge-ancestor-metadata.json')),run=JSON.parse(fs.readFileSync('premerge-ancestor-run.json')),archive=fs.readFileSync('premerge-ancestor.zip'),downloadDigest='sha256:'+crypto.createHash('sha256').update(archive).digest('hex'),match=metadata.name.match(/-run-([0-9]+)-attempt-([0-9]+)-head-([0-9a-f]{40})-phase-(f11|selection)$/);if(!match||downloadDigest!==metadata.digest||run.id!==metadata.workflow_run.id||run.id!==Number(match[1])||run.run_attempt!==Number(match[2])||run.id!==failure.runId||run.run_attempt!==failure.runAttempt||run.head_sha!==failure.terminalDevelopSha||match[3]!==failure.terminalDevelopSha||run.head_branch!=='develop'||run.event!=='push'||run.status!=='completed'||!run.conclusion||run.conclusion==='success'||run.path!=='.github/workflows/ci.yml'||run.repository?.full_name!==process.env.GITHUB_REPOSITORY)throw Error('premerge ancestor provenance mismatch');process.stdout.write(JSON.stringify({evidenceId:failure.evidenceId,attemptId:failure.attemptId,payloadDigest:process.env.EXPECTED_DIGEST,artifactId:metadata.id,artifactName:metadata.name,archiveDigest:metadata.digest,downloadDigest,runId:run.id,runAttempt:run.run_attempt,headSha:failure.headSha,terminalDevelopSha:failure.terminalDevelopSha})+'\n');
          NODE
                matched=true; break
              done
              test "$matched" = true
            done
            node -e 'const f=require("node:fs"),s=f.readFileSync("premerge-ancestor-authorities.ndjson","utf8").trim();f.writeFileSync("premerge-ancestor-authorities.json",JSON.stringify(s?s.split("\n").map(JSON.parse):[]))'
          fi
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';import {buildActivationCapture,buildCandidateReport} from './scripts/evidence/bootstrap-export.mjs';const read=p=>JSON.parse(fs.readFileSync(p)),pr=read('pr.json'),currentRun=read('current-run.json'),headCommit=read('head-commit.json'),headTree=read('head-tree.json'),baseTree=read('base-tree.json'),headBlobs=read('head-blobs.json'),publicationStatus=read('publication-status.json'),abandonmentAuthorities=read('activation-abandonments.json'),prPages=read('pr-pages.json'),runPages=read('run-pages.json'),artifactPages=read('artifact-pages.json'),report=buildCandidateReport(['bootstrap-attempts.json','bootstrap-landed-recoveries.json'].map(name=>({filename:name,bytes:fs.readFileSync(`docs/releases/2.5.0/evidence/${name}`)}))),preparedAuthority=report.registries.find(x=>x.name==='bootstrap-attempts.json')?.candidate.preparedAuthority;if(!preparedAuthority)throw Error('branch commit lacks embedded prepared authority');const authority={repository:process.env.GITHUB_REPOSITORY,pr,currentRun,headCommit,headTree,baseTree,headBlobs,publicationStatus,abandonmentAuthorities,prPages,runPages,artifactPages,paginationComplete:true,observedAt:new Date().toISOString(),priorFailure:read('prior-failure.json'),preparedAuthority};authority.capture=buildActivationCapture(authority,report);fs.writeFileSync('activation-authority.json',JSON.stringify(authority));
          NODE
          node scripts/evidence/bootstrap-export.mjs --activate-authority activation-authority.json --plan docs/RELEASE_2.5.0_PLAN.md --spec docs/RELEASE_2.5.0_TEST_SPEC.md docs/releases/2.5.0/evidence/bootstrap-attempts.json docs/releases/2.5.0/evidence/bootstrap-landed-recoveries.json > candidate-registry-report.g01.json
          created_at="$(node -p 'JSON.parse(require("node:fs").readFileSync("activation-authority.json")).observedAt')"
          node scripts/evidence/bootstrap-export.mjs --f7 --activate-authority activation-authority.json --plan docs/RELEASE_2.5.0_PLAN.md --spec docs/RELEASE_2.5.0_TEST_SPEC.md --source-sha "$SOURCE_SHA" --source-branch "$SOURCE_BRANCH" --created-at "$created_at" docs/releases/2.5.0/evidence/bootstrap-attempts.json docs/releases/2.5.0/evidence/bootstrap-landed-recoveries.json > f7.json
          attempt_id="$(node -p 'JSON.parse(require("node:fs").readFileSync("f7.json")).attemptId')"
          suffix="$(node -p 'JSON.parse(require("node:fs").readFileSync("f7.json")).evidenceId.slice("ci-bundle.".length)')"
          mv f7.json "ci-bundle.$suffix"
          artifact_name="g01-candidate-$attempt_id-run-$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT-head-$SOURCE_SHA"
          printf 'attempt_id=%s\nartifact_name=%s\nsuffix=%s\n' "$attempt_id" "$artifact_name" "$suffix" >> "$GITHUB_OUTPUT"
          printf 'G01_ATTEMPT_ID=%s\nG01_F7_ARTIFACT_NAME=%s\nG01_SUFFIX=%s\n' "$attempt_id" "$artifact_name" "$suffix" >> "$GITHUB_ENV"
      - name: Persist G01 F7 evidence
        id: f7_upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.f7.outputs.artifact_name }}
          path: |
            ci-bundle.*.json
            candidate-registry-report.g01.json
            activation-authority.json
            premerge-ancestor-authorities.json
          if-no-files-found: error
          retention-days: 90
      - name: Await exact-head independent approvals and emit F9
        shell: bash
        run: |
          set -euo pipefail
          for value in "$REVIEWER_CODE_ID" "$REVIEWER_ARCHITECT_ID" "$REVIEWER_VERIFIER_ID"; do [[ "$value" =~ ^[1-9][0-9]*$ ]] || exit 1; done
          test "$REVIEWER_CODE_ID" != "$REVIEWER_ARCHITECT_ID" && test "$REVIEWER_CODE_ID" != "$REVIEWER_VERIFIER_ID" && test "$REVIEWER_ARCHITECT_ID" != "$REVIEWER_VERIFIER_ID"
          for poll in $(seq 1 90); do
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/${{ steps.f7_upload.outputs.artifact-id }}" > f7-metadata.json
            if test "$(node -p 'JSON.parse(require("node:fs").readFileSync("f7-metadata.json")).expired')" = false; then
              gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/${{ steps.f7_upload.outputs.artifact-id }}/zip" > f7.zip
              node -e 'const f=require("node:fs"),c=require("node:crypto"),m=JSON.parse(f.readFileSync("f7-metadata.json")),b=f.readFileSync("f7.zip"),d="sha256:"+c.createHash("sha256").update(b).digest("hex");if(d!==m.digest)throw Error("F7 archive digest mismatch");f.writeFileSync("f7-download-digest.txt",d)'
              rm -rf /tmp/g01-f7; mkdir /tmp/g01-f7; unzip -q f7.zip -d /tmp/g01-f7
              test "$(find /tmp/g01-f7 -maxdepth 1 -type f -name 'ci-bundle.*.json' | wc -l | tr -d ' ')" = 1
              f7_file="$(find /tmp/g01-f7 -maxdepth 1 -type f -name 'ci-bundle.*.json')"
              F7_FILE="$f7_file" node -e 'const f=require("node:fs"),c=require("node:crypto");f.writeFileSync("f7-payload-digest.txt","sha256:"+c.createHash("sha256").update(f.readFileSync(process.env.F7_FILE)).digest("hex"))'
              test -f /tmp/g01-f7/premerge-ancestor-authorities.json
              node - <<'NODE'
