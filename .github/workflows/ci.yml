name: CI/CD

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]
permissions:
  contents: read

# Cancel superseded runs on PRs; push runs always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      verified: ${{ steps.reuse.outputs.verified }}
      base: ${{ steps.route.outputs.base }}
      selection: ${{ steps.route.outputs.selection }}
      digest: ${{ steps.route.outputs.digest }}
      schedule: ${{ steps.schedule.outputs.schedule }}
      app: ${{ steps.route.outputs.app }}
      site: ${{ steps.route.outputs.site }}
      docs: ${{ steps.route.outputs.docs }}
      installer: ${{ steps.route.outputs.installer }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Route the changes to their consumers
        id: route
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          node --test scripts/test/{changed-components,test-lanes,verification-policy}.test.mts
          bash scripts/test/reuse-app-checks.sh
          node scripts/ci/changed-components.mts "$BASE_SHA" "$GITHUB_SHA" ${PR_HEAD:+"$PR_HEAD"} >> "$GITHUB_OUTPUT"
          # JSON escapes arbitrary Git filenames; never interpolate paths as shell code.
          cat "$GITHUB_OUTPUT" >> "$GITHUB_STEP_SUMMARY"

      - name: Look for already verified application changes
        id: reuse
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
          SELECTION_DIGEST: ${{ steps.route.outputs.digest }}
        run: |
          if ! timeout 25s bash scripts/ci/reuse-app-checks.sh; then
            echo "PR verification lookup failed. Running app checks."
            echo 'verified=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Schedule verification (full on main or a push without proof)
        id: schedule
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_BRANCH: ${{ github.base_ref || github.ref_name }}
          SELECTION: ${{ steps.route.outputs.selection }}
          VERIFIED: ${{ steps.reuse.outputs.verified }}
        run: node scripts/ci/verification-policy.mts schedule >> "$GITHUB_OUTPUT"

  policy:
    name: Git Flow policy
    needs: [changes, check-lane, check, api-unit, api-integration, test, test-web, voice-join, voice-features, ui-audit, goal-g05, widget-smoke, personal-smoke, installer, static-publication, site, docs]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Validate source branch and Conventional Commit PR title
        if: github.event_name == 'pull_request'
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          set -euo pipefail
          title_pattern='^(feat|fix|docs|test|refactor|chore|perf|style|build|ci|revert)(\([a-z0-9._/-]+\))?!?: .+'

          if [[ ! "$PR_TITLE" =~ $title_pattern ]]; then
            echo "PR title must follow Conventional Commits, for example: feat(web): add room search"
            exit 1
          fi

          case "$BASE_BRANCH:$HEAD_BRANCH" in
            develop:feature/*|develop:release/*|develop:hotfix/*|develop:main|main:release/*|main:hotfix/*)
              ;;
            *)
              echo "Invalid Git Flow route: $HEAD_BRANCH -> $BASE_BRANCH"
              echo "Expected feature/* -> develop, release/* -> main, or hotfix/* -> main. Back-merges may target develop."
              exit 1
              ;;
          esac

      - name: Require fresh, intentionally skipped or proven prior evidence for every lane
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_BRANCH: ${{ github.base_ref || github.ref_name }}
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci/verification-policy.mts verify

  # The lanes run in parallel; together they are `npm run check:app` plus the build.
  check-lane:
    name: Check ${{ matrix.lane }}
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.schedule).lanes, 'check-lane')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lane: [types, conventions, lint, build]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - if: matrix.lane != 'build'
        run: npm run check:app:${{ matrix.lane }}
      - name: Build the app and verify its deployment artifacts
        if: matrix.lane == 'build'
        env:
          LIVEKIT_DOMAIN: "lk$&x$'y.example.com"
        run: |
          npm run build:app
          WEB_DEPLOY_CONTRACT=built npm --workspace @voiceroom/web run test -- \
            test/deploy-contract.test.ts -t 'a production (web|widget) build keeps the deployment contract'

      - name: Verify maintained browser fixture inventory without launching browsers
        if: matrix.lane == 'build'
        run: |
          for workspace in web meet; do
            export PLAYWRIGHT_JSON_OUTPUT_FILE="$RUNNER_TEMP/discovered-$workspace.json"
            npm --workspace "@voiceroom/$workspace" run e2e -- --list --reporter=json
            node scripts/ci/completed-tests.mts "$workspace" "$PLAYWRIGHT_JSON_OUTPUT_FILE"
          done
          export PLAYWRIGHT_JSON_OUTPUT_FILE="$RUNNER_TEMP/discovered-ui-audit.json"
          npm --workspace @voiceroom/web run e2e -- --config playwright.ui-audit.config.ts --list --reporter=json
          node scripts/ci/completed-tests.mts audit-discovery "$PLAYWRIGHT_JSON_OUTPUT_FILE"

      - name: Script tests and real Caddy log-redaction regression
        if: matrix.lane == 'build'
        env:
          CADDY_TEST_IMAGE: caddy:2.11.4-alpine
        run: |
          docker pull "$CADDY_TEST_IMAGE"
          tests=()
          for test in scripts/test/*.test.mts; do
            # Routing runs in changes; coverage-gate runs with PostgreSQL on both events.
            case "$test" in
              scripts/test/changed-components.test.mts|scripts/test/test-lanes.test.mts|scripts/test/verification-policy.test.mts|scripts/test/coverage-gate.test.mts) continue ;;
            esac
            tests+=("$test")
          done
          node --test --test-concurrency=4 "${tests[@]}"

  # Branch protection on main requires this name.
  check:
    name: Lint, typecheck & build
    needs: [changes, check-lane]
    if: ${{ !cancelled() && contains(fromJSON(needs.changes.outputs.schedule).lanes, 'check') }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every check lane
        env:
          LANES_RESULT: ${{ needs.check-lane.result }}
        run: |
          if [[ "$LANES_RESULT" != success ]]; then
            echo "::error::Check lanes finished with: $LANES_RESULT"
            exit 1
          fi

  # Both fixture jobs start after routing. Only integration provisions PostgreSQL.
  api-unit:
    name: API without PostgreSQL
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.schedule).lanes, 'api-unit')
    runs-on: ubuntu-latest
    env:
      FIXTURE: unit
    steps: &api-lane
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Collect raw V8 coverage for assigned tests
        run: node scripts/coverage/run-g08.mts --fixture "$FIXTURE"
      - name: Upload fixture coverage and assignment
        uses: actions/upload-artifact@v5
        with:
          name: g08-raw-${{ env.FIXTURE }}
          path: coverage/g08-${{ env.FIXTURE }}/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  api-integration:
    name: API with PostgreSQL
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.schedule).lanes, 'api-integration')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      FIXTURE: integration
      # Admin-capable URL: the API test harness creates and drops a temporary
      # database per integration test, so it needs CREATE DATABASE privileges.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps: *api-lane

  # Stable required check: a selected but skipped or failed producer is not evidence.
  test:
    name: API tests
    needs: [changes, api-unit, api-integration]
    if: ${{ !cancelled() && contains(fromJSON(needs.changes.outputs.schedule).lanes, 'test') }}
    runs-on: ubuntu-latest
    steps:
      - name: Require both API fixture jobs
        env:
          UNIT_RESULT: ${{ needs.api-unit.result }}
          INTEGRATION_RESULT: ${{ needs.api-integration.result }}
        run: |
          if [[ "$UNIT_RESULT:$INTEGRATION_RESULT" != success:success ]]; then
            echo "::error::API fixture results: unit=$UNIT_RESULT integration=$INTEGRATION_RESULT"
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      # Collecting and judging coverage needs the API workspace's existing TypeBox and TypeScript packages.
      - run: npm ci --workspace @voiceroom/api
      - uses: actions/download-artifact@v5
        with:
          name: g08-raw-unit
          path: coverage/g08-unit
      - uses: actions/download-artifact@v5
        with:
          name: g08-raw-integration
          path: coverage/g08-integration
      - name: Validate assignments and collect merged G08 coverage
        run: node scripts/coverage/run-g08.mts --merge
      - name: Capture protected-base coverage policy and changed files
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          baseline_args=$(node scripts/coverage/g08-inputs.mts --base "$BASE" ${PR_HEAD:+--head "$PR_HEAD"} --tested HEAD --out coverage)
          echo "G08_BASELINE_ARGS=$baseline_args" >> "$GITHUB_ENV"
      - name: Enforce G08 coverage and protected-base ratchet
        shell: bash
        run: |
          read -r -a baseline_args <<< "$G08_BASELINE_ARGS"
          node scripts/coverage/check-release-250-coverage.mts \
            --coverage coverage/release-250-summary.json \
            --changed-files coverage/release-250-changed-files.txt \
            --changed-diff coverage/release-250-changed.diff \
            "${baseline_args[@]}"
      - name: Persist G08 measured coverage artifact
        # A red patch needs the same per-file evidence as a green one.
        if: ${{ !cancelled() && hashFiles('coverage/release-250-summary.json') != '' }}
        uses: actions/upload-artifact@v5
        with:
          name: g08-release-250-coverage-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}-head-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            coverage/release-250-summary.json
            coverage/release-250-changed-files.txt
            coverage/release-250-changed.diff
            coverage/release-250-base-thresholds.json
          if-no-files-found: error
          retention-days: 90

  test-web:
    name: Web tests
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.schedule).lanes, 'test-web')
    outputs:
      completed: ${{ steps.evidence.outputs.completed }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Test Web workspace
        if: contains(fromJSON(needs.changes.outputs.schedule).workspaces, 'web')
        env:
          WORKSPACE: web
          WEB_DEPLOY_CONTRACT: checked
        run: &test-workspace |
          report="$RUNNER_TEMP/$WORKSPACE.json"
          npm --workspace "@voiceroom/$WORKSPACE" test -- --reporter=default --reporter=json --outputFile.json="$report"
          node scripts/ci/completed-tests.mts workspace "$report"
          echo "$WORKSPACE" >> "$RUNNER_TEMP/completed-workspaces"
      - name: Test Admin workspace
        if: contains(fromJSON(needs.changes.outputs.schedule).workspaces, 'admin')
        env:
          WORKSPACE: admin
        run: *test-workspace
      - name: Test Meet workspace
        if: contains(fromJSON(needs.changes.outputs.schedule).workspaces, 'meet')
        env:
          WORKSPACE: meet
        run: *test-workspace
      - name: Test Widget workspace
        if: contains(fromJSON(needs.changes.outputs.schedule).workspaces, 'widget')
        env:
          WORKSPACE: widget
        run: *test-workspace
      - name: Record workspaces with executed test files
        id: evidence
        run: echo "completed=$(jq -Rn -c '[inputs]' < "$RUNNER_TEMP/completed-workspaces")" >> "$GITHUB_OUTPUT"

  voice-join:
    name: Voice room join smoke
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.schedule).lanes, 'voice-join')
    outputs:
      completed: ${{ steps.evidence.outputs.completed }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FIXTURE: voice
    steps: &voice-stack-steps
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install the selected browser fixture's dependencies
        run: |
          extra=()
          # Only the real reaction pagination test imports the API workspace's pg client.
          if [[ ${E2E_REAL_REACTIONS:-} == true ]]; then extra+=(--workspace @voiceroom/api); fi
          npm ci "${extra[@]}" --workspace @voiceroom/web --workspace @voiceroom/shared --workspace @voiceroom/ui --workspace @voiceroom/ui-kit --workspace @voiceroom/call
      - name: Start the voice stack and pull the Playwright image
        env:
          VOICE_CALLS_ENABLED: "true"
        run: |
          version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          image="mcr.microsoft.com/playwright:v${version}-noble"
          docker pull "$image" &
          browser_pull=$!
          docker compose -f docker-compose.ci.yml up -d --build --wait --wait-timeout 180
          wait "$browser_pull"
          echo "PLAYWRIGHT_IMAGE=$image" >> "$GITHUB_ENV"
      - name: Exercise selected voice journeys through production-like services
        id: evidence
        env:
          GROUPS_JSON: ${{ toJSON(fromJSON(needs.changes.outputs.schedule).groups) }}
        run: |
          paths=$(node scripts/ci/verification-policy.mts "$FIXTURE-specs")
          read -r -a specs <<< "$paths"
          db_env=()
          if [[ ${E2E_REAL_REACTIONS:-} == true ]]; then
            E2E_DATABASE_URL=$(docker compose -f docker-compose.ci.yml exec -T api node -e '
              const url = new URL(process.env.DATABASE_URL);
              url.host = "127.0.0.1:55439";
              process.stdout.write(url.href)')
            export E2E_DATABASE_URL
            db_env+=(-e E2E_REAL_REACTIONS -e E2E_DATABASE_URL)
          fi
          docker run --rm --init --network host --ipc host --user "$(id -u):$(id -g)" \
            "${db_env[@]}" \
            -e HOME=/tmp -e CI -e PLAYWRIGHT_JSON_OUTPUT_FILE=/work/voice-report.json -v "$GITHUB_WORKSPACE:/work" -w /work "$PLAYWRIGHT_IMAGE" \
            npm --workspace @voiceroom/web run e2e -- \
            "${specs[@]}" --project=chromium --retries=0 --reporter=line,json
          node scripts/ci/completed-tests.mts "$FIXTURE" voice-report.json >> "$GITHUB_OUTPUT"
      # No teardown step: a hosted runner is discarded after the job together
      # with its containers and volumes.
      - name: Capture voice stack diagnostics
        if: failure()
        run: |
          docker compose -f docker-compose.ci.yml ps
          docker compose -f docker-compose.ci.yml logs --no-color --tail=250

  voice-features:
    name: Voice feature journeys
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.schedule).lanes, 'voice-features')
    outputs:
      completed: ${{ steps.evidence.outputs.completed }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FIXTURE: voice-features
      E2E_REAL_REACTIONS: ${{ contains(fromJSON(needs.changes.outputs.schedule).groups, 'voice-reactions') && 'true' || 'false' }}
    steps: *voice-stack-steps

  ui-audit:
    name: Cross-browser UI audit
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.schedule).lanes, 'ui-audit')
    outputs:
      completed: ${{ steps.evidence.outputs.completed }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit firefox
      - name: Exercise Web, Admin and Site across three browser engines
        id: evidence
        env:
          GROUPS_JSON: ${{ toJSON(fromJSON(needs.changes.outputs.schedule).groups) }}
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/ui-audit-report.json
        run: |
          npm --workspace @voiceroom/web run e2e -- --config playwright.ui-audit.config.ts --workers=1 --reporter=line,json
          node scripts/ci/completed-tests.mts ui-audit "$PLAYWRIGHT_JSON_OUTPUT_FILE" >> "$GITHUB_OUTPUT"

  goal-g05:
    name: G05 strict LiveKit gate proof
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.schedule).lanes, 'goal-g05')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The API test job already runs the LiveKit boundary test file.
      - run: G05_SELECTED_MECHANISM=external-auth-gate node scripts/lkv/run-strict-boundary-proof.mts --json --fail-on-blocked

  widget-smoke:
    name: Embedded guest call and media boundary
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.schedule).lanes, 'widget-smoke')
    outputs:
      completed: ${{ steps.evidence.outputs.completed }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_WIDGET_COMPOSE_PROJECT: widget-ci-${{ github.run_id }}-${{ github.run_attempt }}
      PLAYWRIGHT_WIDGET_E2E: "1"
      PLAYWRIGHT_WIDGET_RECOVERY: "1"
      WIDGET_ENABLED: "true"
      CI_GATE_PUBLIC_URL: wss://localhost:19443
      CI_ROOM_CREATE_POW_DIFFICULTY: "4"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm --workspace @voiceroom/widget run build
      - name: Start the isolated widget API and SFU
        run: |
          docker compose -p "$PLAYWRIGHT_WIDGET_COMPOSE_PROJECT" -f docker-compose.ci.yml up -d --build --wait --wait-timeout 180 api
          docker compose -p "$PLAYWRIGHT_WIDGET_COMPOSE_PROJECT" -f docker-compose.ci.yml exec -T postgres \
            psql -v ON_ERROR_STOP=1 -U voice_room -d voice_room_ci \
            -c 'UPDATE widget_boundary_activation SET widget_boundary_required=true, widget_admission_enabled=true WHERE singleton'
      - name: Exercise frozen loader compatibility, reconnect and SFU denials
        id: evidence
        env:
          GROUPS_JSON: ${{ toJSON(fromJSON(needs.changes.outputs.schedule).groups) }}
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/widget.json
        run: |
          paths=$(node scripts/ci/verification-policy.mts widget-specs)
          read -r -a specs <<< "$paths"
          npm --workspace @voiceroom/web run e2e -- "${specs[@]}" --reporter=line,json
          node scripts/ci/completed-tests.mts widget "$PLAYWRIGHT_JSON_OUTPUT_FILE" >> "$GITHUB_OUTPUT"
      - name: Report widget service states
        if: failure()
        run: |
          docker compose -p "$PLAYWRIGHT_WIDGET_COMPOSE_PROJECT" -f docker-compose.ci.yml ps --all
          docker compose -p "$PLAYWRIGHT_WIDGET_COMPOSE_PROJECT" -f docker-compose.ci.yml logs --no-color --timestamps api livekit-gate livekit > widget-services.log
          tail -n 200 widget-services.log
      - name: Keep widget traces and service logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: widget-e2e-${{ github.run_attempt }}
          path: |
            apps/web/test-results
            widget-services.log
          retention-days: 7
      - name: Remove widget stack resources
        if: always()
        run: docker compose -p "$PLAYWRIGHT_WIDGET_COMPOSE_PROJECT" -f docker-compose.ci.yml down -v --rmi local

  personal-smoke:
    name: Personal Compose smoke
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.schedule).lanes, 'personal-smoke')
    outputs:
      completed: ${{ steps.evidence.outputs.completed }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PERSONAL_SMOKE_PROJECT: personal-ci-${{ github.run_id }}-${{ github.run_attempt }}
      # Caddy issues the turn.localhost certificate from its local CA in CI.
      PERSONAL_DOMAIN: localhost
      PERSONAL_ORIGIN: http://127.0.0.1:5187
      PERSONAL_CADDY_SITE: http://127.0.0.1
      PERSONAL_SIGNAL_URL: ws://127.0.0.1:5187
      PERSONAL_BIND_HOST: 127.0.0.1
      PERSONAL_HTTP_PORT: "5187"
      PERSONAL_HTTPS_PORT: "5443"
      PERSONAL_LIVEKIT_EXTERNAL_IP: "false"
      PERSONAL_LIVEKIT_NODE_IP: 127.0.0.1
      PERSONAL_POSTGRES_PASSWORD: personal-ci-password
      PERSONAL_GATE_SECRET: personal-ci-gate-secret-at-least-32-bytes
      PERSONAL_LIVEKIT_API_KEY: personal-ci-key
      PERSONAL_LIVEKIT_API_SECRET: personal-ci-livekit-secret-at-least-32-bytes
      PERSONAL_ROOM_IDLE_TTL_MS: "10000"
      PERSONAL_ROOM_PRUNE_INTERVAL_MS: "250"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --workspace @voiceroom/api --workspace @voiceroom/meet --workspace @voiceroom/shared --workspace @voiceroom/ui --workspace @voiceroom/ui-kit --workspace @voiceroom/call
      - run: npx playwright install --with-deps chromium
      - name: Start the personal stack with clean project volumes
        run: docker compose -p "$PERSONAL_SMOKE_PROJECT" -f docker-compose.personal.yml up -d --build --wait --wait-timeout 120
      - run: node --test scripts/ci/personal-compose-smoke.test.mts
      - name: Exercise a two-guest Meet call through Caddy
        id: evidence
        env:
          GROUPS_JSON: ${{ toJSON(fromJSON(needs.changes.outputs.schedule).groups) }}
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/personal.json
        run: |
          npm --workspace @voiceroom/meet run e2e -- --reporter=line,json
          node scripts/ci/completed-tests.mts personal "$PLAYWRIGHT_JSON_OUTPUT_FILE" >> "$GITHUB_OUTPUT"
      - name: Report personal service states
        if: failure()
        run: docker compose -p "$PERSONAL_SMOKE_PROJECT" -f docker-compose.personal.yml ps --all
      - name: Remove personal stack resources
        if: always()
        run: |
          docker compose -p "$PERSONAL_SMOKE_PROJECT" -f docker-compose.personal.yml down -v --rmi local
          if docker image inspect "$PERSONAL_SMOKE_PROJECT-api" >/dev/null 2>&1; then
            docker image rm "$PERSONAL_SMOKE_PROJECT-api"
          fi

  installer:
    name: Meet installer and CLI tests
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.schedule).lanes, 'installer')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: sudo python3 -B -m unittest discover -s apps/get/test -v

  record-app-checks:
    name: Record verified application tree
    needs: [changes, policy]
    if: >-
      !cancelled() && github.event_name == 'pull_request' && github.base_ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository && needs.policy.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Record the tested tree
        id: tree
        env:
          BASE_SHA: ${{ needs.changes.outputs.base }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SELECTION_DIGEST: ${{ needs.changes.outputs.digest }}
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "name=verified-dev-pr-$PR_NUMBER-$BASE_SHA-$tree-$GITHUB_RUN_ATTEMPT-$SELECTION_DIGEST" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$tree" > verified-tree.txt
      - uses: actions/upload-artifact@v6
        # A storage failure only disables check reuse on the subsequent push.
        continue-on-error: true
        with:
          name: ${{ steps.tree.outputs.name }}
          path: verified-tree.txt
          if-no-files-found: error
          retention-days: 7

  images:
    name: Publish images
    needs: &app-checks [changes, policy]
    if: &publish-app >-
      !cancelled() && github.event_name == 'push' && needs.policy.result == 'success' &&
      needs.changes.outputs.app == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml

  # Client builds need only the sources, so they run beside the image builds.
  client-artifacts:
    needs: *app-checks
    if: *publish-app
    uses: ./.github/workflows/build-client.yml
    with:
      component: all

  deploy-dev:
    name: Deploy dev
    needs: [images, client-artifacts]
    # Publication can succeed after skipping the individual app checks.
    if: ${{ !cancelled() && github.event_name == 'push' && needs.images.result == 'success' && needs.client-artifacts.result == 'success' }}
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
      url: https://dev.voiceroom.ru
    secrets: inherit

  deploy-clients-dev:
    name: Deploy dev ${{ matrix.component }}
    needs: deploy-dev
    # Skipped checks earlier in the chain would otherwise skip this job too.
    if: ${{ !cancelled() && needs.deploy-dev.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        component: [admin, widget]
    uses: ./.github/workflows/deploy-client.yml
    with:
      component: ${{ matrix.component }}
      environment: dev
    secrets: inherit

  static-publication:
    name: Static publication checks
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.schedule).lanes, 'static-publication')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash scripts/test/static-publication.sh

  site:
    name: Site checks
    needs: [changes, static-publication]
    if: contains(fromJSON(needs.changes.outputs.schedule).lanes, 'site')
    uses: ./.github/workflows/build-static.yml
    with:
      component: site
      check-publication: false

  docs:
    name: Docs checks
    needs: [changes, static-publication]
    if: contains(fromJSON(needs.changes.outputs.schedule).lanes, 'docs')
    uses: ./.github/workflows/build-static.yml
    with:
      component: docs
      check-publication: false

  deploy-site-dev:
    name: Deploy site to dev
    needs: [changes, policy, site]
    if: >-
      !cancelled() && github.event_name == 'push' && needs.policy.result == 'success' &&
      needs.changes.outputs.site == 'true' && needs.site.result == 'success'
    uses: ./.github/workflows/deploy-static.yml
    with:
      component: site
      environment: dev
    secrets: inherit

  deploy-docs-dev:
    name: Deploy docs to dev
    needs: [changes, policy, docs]
    if: >-
      !cancelled() && github.event_name == 'push' && needs.policy.result == 'success' &&
      needs.changes.outputs.docs == 'true' && needs.docs.result == 'success'
    uses: ./.github/workflows/deploy-static.yml
    with:
      component: docs
      environment: dev
    secrets: inherit
