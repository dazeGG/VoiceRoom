          const fs=require('node:fs'),all=JSON.parse(fs.readFileSync('ancestor-artifact-pages.json')).flatMap(p=>p.artifacts),e=JSON.parse(fs.readFileSync('ancestor-expected.json'))[Number(process.env.INDEX)],re=new RegExp(`^g01-bootstrap-failure-${e.attemptId}-run-[0-9]+-attempt-[0-9]+-head-[0-9a-f]{40}-phase-(?:f11|selection)$`),rows=all.filter(a=>re.test(a.name)&&!a.expired).sort((a,b)=>a.id-b.id);if(!rows.length)throw Error('ancestor failure metadata absent');fs.writeFileSync('ancestor-candidates.json',JSON.stringify(rows));
          NODE
              matched=false; candidates="$(node -p 'JSON.parse(require("node:fs").readFileSync("ancestor-candidates.json")).length')"
              for candidate in $(seq 0 $((candidates-1))); do
                artifact_id="$(INDEX="$candidate" node -p 'JSON.parse(require("node:fs").readFileSync("ancestor-candidates.json"))[Number(process.env.INDEX)].id')"; gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > ancestor.zip; rm -rf /tmp/g01-ancestor; mkdir /tmp/g01-ancestor; unzip -q ancestor.zip -d /tmp/g01-ancestor
                evidence="$(INDEX="$index" node -p 'JSON.parse(require("node:fs").readFileSync("ancestor-expected.json"))[Number(process.env.INDEX)].evidenceId')"; test -f "/tmp/g01-ancestor/$evidence" || continue
                actual="sha256:$(sha256sum "/tmp/g01-ancestor/$evidence" | cut -d' ' -f1)"; expected="$(INDEX="$index" node -p 'JSON.parse(require("node:fs").readFileSync("ancestor-expected.json"))[Number(process.env.INDEX)].digest')"; test "$actual" = "$expected" || continue
                INDEX="$candidate" node -e 'const f=require("node:fs");f.writeFileSync("ancestor-metadata.json",JSON.stringify(JSON.parse(f.readFileSync("ancestor-candidates.json"))[Number(process.env.INDEX)]))'; run_id="$(node -p 'JSON.parse(require("node:fs").readFileSync("ancestor-metadata.json")).workflow_run.id')"; gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > ancestor-run.json
                EVIDENCE="/tmp/g01-ancestor/$evidence" EXPECTED_DIGEST="$expected" node --input-type=module - <<'NODE' >> ancestor-failures.ndjson
          import fs from 'node:fs';import {validateBootstrapFailure} from './scripts/evidence/emit-bootstrap-selection.mjs';const failure=validateBootstrapFailure(JSON.parse(fs.readFileSync(process.env.EVIDENCE))),m=JSON.parse(fs.readFileSync('ancestor-metadata.json')),match=m.name.match(/-run-([0-9]+)-attempt-([0-9]+)-head-([0-9a-f]{40})-phase-/);if(!match)throw Error('failure artifact name malformed');process.stdout.write(JSON.stringify({attemptId:failure.attemptId,evidenceId:failure.evidenceId,digest:process.env.EXPECTED_DIGEST,artifactId:m.id,artifactName:m.name,archiveDigest:m.digest,runId:Number(match[1]),runAttempt:Number(match[2]),headSha:failure.headSha,baseSha:failure.baseSha,parentSha:failure.parentSha,terminalDevelopSha:failure.terminalDevelopSha,createdAt:failure.createdAt})+'\n');
          NODE
                PAYLOAD_DIGEST="$expected" node -e 'const f=require("node:fs"),c=require("node:crypto"),m=JSON.parse(f.readFileSync("ancestor-metadata.json")),b=f.readFileSync("ancestor.zip"),d="sha256:"+c.createHash("sha256").update(b).digest("hex");if(d!==m.digest)throw Error("ancestor archive digest mismatch");process.stdout.write(JSON.stringify({metadata:m,run:JSON.parse(f.readFileSync("ancestor-run.json")),downloadDigest:d,payloadDigest:process.env.PAYLOAD_DIGEST,matchCount:1})+"\n")' >> ancestor-authorities.ndjson
                matched=true; break
              done
              test "$matched" = true
            done
            node -e 'const f=require("node:fs");for(const [i,o] of [["ancestor-failures.ndjson","bootstrap-ancestor-failures.json"],["ancestor-authorities.ndjson","ancestor-artifacts.json"]])f.writeFileSync(o,JSON.stringify(f.readFileSync(i,"utf8").trim().split("\n").map(JSON.parse)))'; extra=(--ancestors bootstrap-ancestor-failures.json --ancestor-artifacts ancestor-artifacts.json)
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/develop" > develop-ref.json; gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > current-run.json; encoded="$(node -p 'encodeURIComponent(process.argv[1])' "$branch")"; status="$(curl --proto '=https' --tlsv1.2 -sS -o source-ref.json -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/$encoded")"; test "$status" = 404
          SOURCE_REF_STATUS="$status" F11_FILE="$f11_file" node - <<'NODE'
          const fs=require('node:fs');const read=p=>JSON.parse(fs.readFileSync(p));const f11=read(process.env.F11_FILE),artifact=l=>({metadata:read(`${l}-metadata.json`),run:read(`${l}-run.json`),downloadDigest:fs.readFileSync(`${l}-download-digest.txt`,'utf8'),payloadDigest:fs.readFileSync(`${l}-payload-digest.txt`,'utf8'),matchCount:1});fs.writeFileSync('selection-authority.json',JSON.stringify({pr:read('pr.json'),developRef:read('develop-ref.json'),sourceRefStatus:Number(process.env.SOURCE_REF_STATUS),postMergeRun:f11.postMergeRun,selectionRun:read('current-run.json'),observedAt:new Date().toISOString(),repository:process.env.GITHUB_REPOSITORY,f7Artifact:artifact('f7'),f9Artifact:artifact('f9'),f11Artifact:artifact('f11')}));
          NODE
          selection_file="bootstrap-selection.$ATTEMPT_ID.json"; node scripts/evidence/emit-bootstrap-selection.mjs --f7 "$f7_file" --f9 "$f9_file" --f11 "$f11_file" --authority selection-authority.json "${extra[@]}" > "$selection_file"
          selection_sha="sha256:$(sha256sum "$selection_file" | cut -d' ' -f1)"; echo "selection_sha256=$selection_sha" >> "$GITHUB_OUTPUT"; echo "G01_SELECTION_FILE=$selection_file" >> "$GITHUB_ENV"; echo "G01_SELECTION_ARTIFACT_NAME=g01-selection-$ATTEMPT_ID-run-$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT-head-$GITHUB_SHA" >> "$GITHUB_ENV"
      - id: selection_upload
        name: Persist post-F11 bootstrap selection with external ID/digest outputs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.G01_SELECTION_ARTIFACT_NAME }}
          path: ${{ env.G01_SELECTION_FILE }}
          if-no-files-found: error
          retention-days: 90
      - name: Publish externally consumable immutable selection metadata
        if: success()
        run: printf 'artifact_id=%s\nartifact_digest=%s\nselection_sha256=%s\n' '${{ steps.selection_upload.outputs.artifact-id }}' '${{ steps.selection_upload.outputs.artifact-digest }}' '${{ steps.selection.outputs.selection_sha256 }}' >> "$GITHUB_STEP_SUMMARY"
      - name: Materialize landed-unsealed selection failure after any failed selection step
        if: always() && (failure() || steps.selection_checkout.outcome == 'failure' || steps.selection_node.outcome == 'failure')
        run: |
          set -euo pipefail
          test -f pr.json || gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > pr.json
          if ! test -f /tmp/g01-selection-f7/candidate-registry-report.g01.json; then
            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --slurp > fallback-artifacts.json
            artifact_id="$(node -p 'JSON.parse(require("node:fs").readFileSync("fallback-artifacts.json")).flatMap(x=>x.artifacts).filter(a=>a.name.startsWith(`g01-candidate-${process.env.ATTEMPT_ID}-run-${process.env.PREMERGE_RUN_ID}-attempt-${process.env.PREMERGE_RUN_ATTEMPT}-`)&&!a.expired).sort((a,b)=>b.id-a.id)[0]?.id??""')"
            test -n "$artifact_id"; gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > fallback-f7.zip; rm -rf /tmp/g01-selection-f7; mkdir /tmp/g01-selection-f7; unzip -q fallback-f7.zip -d /tmp/g01-selection-f7
          fi
          node - <<'NODE'
          const fs=require('node:fs'),p=JSON.parse(fs.readFileSync('pr.json')),report=JSON.parse(fs.readFileSync('/tmp/g01-selection-f7/candidate-registry-report.g01.json')),r=report.registries.find(x=>x.name==='bootstrap-landed-recoveries.json')?.candidate,lineage=r?.landedAncestors??[],attempt=process.env.ATTEMPT_ID;if(attempt.startsWith('g01-recovery-')&&!lineage.length)throw Error('selection fallback cannot authenticate full recovery lineage');const o={schemaVersion:1,release:'2.5.0',status:'G01_LANDED_UNSEALED',attemptId:attempt,evidenceId:`bootstrap-failure.${attempt}.json`,failedPhase:'SELECTION',baseSha:p.base.sha,parentSha:p.base.sha,terminalDevelopSha:process.env.GITHUB_SHA,headSha:p.head.sha,runId:Number(process.env.GITHUB_RUN_ID),runAttempt:Number(process.env.GITHUB_RUN_ATTEMPT),createdAt:new Date().toISOString(),reason:'independent always-run fallback after selection checkout/setup/discovery/selection/upload failure',recoveryLineage:lineage};fs.writeFileSync(o.evidenceId,JSON.stringify(o)+'\n');
          NODE
      - name: Persist immutable landed-unsealed selection failure
        if: always() && hashFiles('bootstrap-failure.*.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: g01-bootstrap-failure-${{ env.ATTEMPT_ID }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}-head-${{ github.sha }}-phase-selection
          path: bootstrap-failure.*.json
          if-no-files-found: error
          retention-days: 90

  deploy:
    name: Deploy to server
    needs: [check, test]
    # Only deploy real pushes to main, never PRs or forks.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Serialize deploys so two pushes can't rebuild the stack concurrently.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            set -euo pipefail
            cd "${{ vars.DEPLOY_PATH || '/srv/voiceroom' }}"
            git fetch --all --prune
            git reset --hard origin/main
            # API applies PostgreSQL migrations on bootstrap before it listens.
            docker compose up -d --build
            docker image prune -f
