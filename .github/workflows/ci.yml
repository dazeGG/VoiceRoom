name: CI/CD

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      bootstrap_metadata_b64:
        description: Base64-encoded post-F11 bootstrap selection metadata JSON
        required: false
        type: string
      bootstrap_f7_b64:
        description: Base64-encoded immutable G01 F7 envelope JSON
        required: false
        type: string
      bootstrap_f9_b64:
        description: Base64-encoded immutable G01 F9 envelope JSON
        required: false
        type: string
      bootstrap_f11_b64:
        description: Base64-encoded immutable G01 F11 envelope JSON
        required: false
        type: string

permissions:
  contents: read

# Cancel superseded runs on PRs; never cancel a main run (it may be mid-deploy).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  policy:
    name: Git Flow policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate source branch and Conventional Commit PR title
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          set -euo pipefail
          title_pattern='^(feat|fix|docs|test|refactor|chore|perf|style|build|ci|revert)(\([a-z0-9._/-]+\))?!?: .+'

          if [[ ! "$PR_TITLE" =~ $title_pattern ]]; then
            echo "PR title must follow Conventional Commits, for example: feat(web): add room search"
            exit 1
          fi

          case "$BASE_BRANCH:$HEAD_BRANCH" in
            develop:feature/*|develop:release/*|develop:hotfix/*|develop:main|main:release/*|main:hotfix/*)
              ;;
            *)
              echo "Invalid Git Flow route: $HEAD_BRANCH -> $BASE_BRANCH"
              echo "Expected feature/* -> develop, release/* -> main, or hotfix/* -> main. Back-merges may target develop."
              exit 1
              ;;
          esac

  check:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Admin-capable URL: the API test harness creates and drops a temporary
      # database per integration test, so it needs CREATE DATABASE privileges.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  bootstrap-plan:
    name: G01 bootstrap plan
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validate canonical plan and bootstrap contracts
        run: |
          python3 scripts/test/validate_release_250_plan.py docs/RELEASE_2.5.0_PLAN.md docs/RELEASE_2.5.0_TEST_SPEC.md
          node --test scripts/test/g01-release-docs.test.mjs scripts/test/g01-oras-lock.test.mjs
          node --test scripts/test/g01-landed-bootstrap-recovery.test.mjs
          node scripts/evidence/recover-landed-bootstrap.mjs --fixture scripts/test/fixtures/g01-landed-bootstrap-recovery.json --validate-only
          node scripts/evidence/validate-envelope.mjs --fixture bootstrap
          scripts/ci/run-actionlint.sh .github/workflows/ci.yml
          scripts/ci/run-oras.sh version
      - name: Export candidate-only G01 report and F7 envelope
        run: |
          node scripts/evidence/bootstrap-export.mjs docs/releases/2.5.0/evidence/bootstrap-attempts.json docs/releases/2.5.0/evidence/bootstrap-landed-recoveries.json > candidate-registry-report.g01.json
          node scripts/evidence/bootstrap-export.mjs --f7 --source-sha "$GITHUB_SHA" --created-at "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" docs/releases/2.5.0/evidence/bootstrap-attempts.json docs/releases/2.5.0/evidence/bootstrap-landed-recoveries.json > ci-bundle.g01.json
      - name: Persist G01 F7 evidence
        uses: actions/upload-artifact@v4
        with:
          name: g01-candidate-evidence
          path: |
            ci-bundle.g01.json
            candidate-registry-report.g01.json
          if-no-files-found: error
          retention-days: 90

  bootstrap-selection:
    name: G01 post-F11 selection handoff
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Decode and validate immutable lifecycle envelopes
        env:
          METADATA_B64: ${{ inputs.bootstrap_metadata_b64 }}
          F7_B64: ${{ inputs.bootstrap_f7_b64 }}
          F9_B64: ${{ inputs.bootstrap_f9_b64 }}
          F11_B64: ${{ inputs.bootstrap_f11_b64 }}
        run: |
          set -euo pipefail
          for name in METADATA_B64 F7_B64 F9_B64 F11_B64; do
            test -n "${!name}" || { echo "missing $name" >&2; exit 1; }
          done
          printf '%s' "$METADATA_B64" | base64 --decode > bootstrap-metadata.json
          printf '%s' "$F7_B64" | base64 --decode > ci-bundle.g01.json
          printf '%s' "$F9_B64" | base64 --decode > approval-envelope.g01.json
          printf '%s' "$F11_B64" | base64 --decode > merge-envelope.g01.json
          attempt_id="$(node -e 'const fs=require("node:fs"); const x=JSON.parse(fs.readFileSync("bootstrap-metadata.json")); if(!/^g01-(a|recovery-a)[0-9]{2,}$/.test(x.attemptId)) process.exit(1); process.stdout.write(x.attemptId)')"
          node scripts/evidence/emit-bootstrap-selection.mjs --metadata bootstrap-metadata.json --f7 ci-bundle.g01.json --f9 approval-envelope.g01.json --f11 merge-envelope.g01.json > "bootstrap-selection.${attempt_id}.json"
          printf '%s' "bootstrap-selection.${attempt_id}.json" > bootstrap-selection-path.txt
      - name: Persist post-F11 bootstrap selection
        uses: actions/upload-artifact@v4
        with:
          name: g01-bootstrap-selection
          path: |
            bootstrap-selection.g01-*.json
            bootstrap-selection-path.txt
          if-no-files-found: error
          retention-days: 90

  deploy:
    name: Deploy to server
    needs: [check, test, bootstrap-plan]
    # Only deploy real pushes to main, never PRs or forks.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Serialize deploys so two pushes can't rebuild the stack concurrently.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            set -euo pipefail
            cd "${{ vars.DEPLOY_PATH || '/srv/voiceroom' }}"
            git fetch --all --prune
            git reset --hard origin/main
            # API applies PostgreSQL migrations on bootstrap before it listens.
            docker compose up -d --build
            docker image prune -f
