        with:
          name: g01-bootstrap-failure-${{ env.G01_ATTEMPT_ID }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}-head-${{ github.sha }}-phase-f11
          path: bootstrap-failure.*.json
          if-no-files-found: error
          retention-days: 90

  bootstrap-selection:
    name: G01 authenticated post-F11 terminal selection
    needs: [check, test, bootstrap-postmerge]
    if: needs.bootstrap-postmerge.outputs.active == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      artifact_id: ${{ steps.selection_upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.selection_upload.outputs.artifact-digest }}
      selection_sha256: ${{ steps.selection.outputs.selection_sha256 }}
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ needs.bootstrap-postmerge.outputs.pr_number }}
      ATTEMPT_ID: ${{ needs.bootstrap-postmerge.outputs.attempt_id }}
      PREMERGE_RUN_ID: ${{ needs.bootstrap-postmerge.outputs.premerge_run_id }}
      PREMERGE_RUN_ATTEMPT: ${{ needs.bootstrap-postmerge.outputs.premerge_run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - id: selection
        name: Re-fetch exact immutable envelopes and emit terminal selection
