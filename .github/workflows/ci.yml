            artifact_id="$(PHASE="$phase" node -p 'JSON.parse(require("node:fs").readFileSync("g02-authority/selection/" + process.env.SELECTION_FILE)).artifactBindings[process.env.PHASE].artifactId')"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" > "g02-authority/$phase-metadata.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "g02-authority/$phase.zip"
            run_id="$(node -p "JSON.parse(require('node:fs').readFileSync('g02-authority/$phase-metadata.json')).workflow_run.id")"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > "g02-authority/$phase-run.json"
            mkdir "g02-authority/$phase"
            unzip -q "g02-authority/$phase.zip" -d "g02-authority/$phase"
          done
          f7_id="$(node -p 'JSON.parse(require("node:fs").readFileSync("g02-authority/selection/" + process.env.SELECTION_FILE)).f7Id')"
          f9_id="$(node -p 'JSON.parse(require("node:fs").readFileSync("g02-authority/selection/" + process.env.SELECTION_FILE)).f9Id')"
          f11_id="$(node -p 'JSON.parse(require("node:fs").readFileSync("g02-authority/selection/" + process.env.SELECTION_FILE)).f11Id')"
          node scripts/evidence/export-goal-evidence.mjs --validate-selection \
            --selection "g02-authority/selection/$SELECTION_FILE" \
            --selection-artifact-id "$SELECTION_ARTIFACT_ID" \
            --head-sha "$BASE_SHA" --origin-develop-sha "$(git rev-parse origin/develop)" \
            --repository "$GITHUB_REPOSITORY" \
            --f7 "g02-authority/f7/$f7_id" --f7-metadata g02-authority/f7-metadata.json --f7-run g02-authority/f7-run.json --f7-archive g02-authority/f7.zip --f7-report g02-authority/f7/candidate-registry-report.g01.json \
            --f9 "g02-authority/f9/$f9_id" --f9-metadata g02-authority/f9-metadata.json --f9-run g02-authority/f9-run.json --f9-archive g02-authority/f9.zip \
            --f11 "g02-authority/f11/$f11_id" --f11-metadata g02-authority/f11-metadata.json --f11-run g02-authority/f11-run.json --f11-archive g02-authority/f11.zip
      - name: Install baseline Chromium
        run: npx playwright install --with-deps chromium
      - name: Start clean stack, run Chromium twice without retry, and prove teardown
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p g02-reports
          cleanup() { docker compose -f docker-compose.ci.yml down --volumes --remove-orphans; }
          trap cleanup EXIT
          docker compose -f docker-compose.ci.yml up -d --build --wait --wait-timeout 180
          npm --workspace @voice-room/web run e2e -- --project=chromium --retries=0 2>&1 | tee g02-reports/chromium-run-1.log
          npm --workspace @voice-room/web run e2e -- --project=chromium --retries=0 2>&1 | tee g02-reports/chromium-run-2.log
          cleanup
          trap - EXIT
          printf 'passed\n' > g02-reports/teardown.txt
      - name: Emit immutable G02 F7 candidate
        shell: bash
        run: |
          set -euo pipefail
