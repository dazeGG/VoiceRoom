  deploy:
    name: Deploy to server
    needs: [check, test]
    # Only deploy real pushes to main, never PRs or forks.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Serialize deploys so two pushes can't rebuild the stack concurrently.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            set -euo pipefail
            cd "${{ vars.DEPLOY_PATH || '/srv/voiceroom' }}"
            git fetch --all --prune
            git reset --hard origin/main
            # API applies PostgreSQL migrations on bootstrap before it listens.
            docker compose up -d --build
            docker image prune -f
