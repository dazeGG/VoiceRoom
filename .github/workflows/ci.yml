name: CI/CD

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]
permissions:
  contents: read

# Cancel superseded runs on PRs; push runs always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      verified: ${{ steps.reuse.outputs.verified }}
      app: ${{ steps.route.outputs.app }}
      site: ${{ steps.route.outputs.site }}
      docs: ${{ steps.route.outputs.docs }}
      installer: ${{ steps.route.outputs.installer }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Route the changes to their consumers
        id: route
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          node --test scripts/test/changed-components.test.mts
          bash scripts/test/reuse-app-checks.sh
          node scripts/ci/changed-components.mts "$BASE_SHA" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          installer=false
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            installer=true
          else
            installer_changes=$(git diff --name-only --no-renames "$BASE_SHA" "$GITHUB_SHA" -- apps/get/)
            if [[ -n "$installer_changes" ]]; then
              installer=true
            fi
          fi
          echo "installer=$installer" >> "$GITHUB_OUTPUT"

      - name: Look for already verified application changes
        id: reuse
        if: github.event_name == 'push' && steps.route.outputs.app == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if ! timeout 25s bash scripts/ci/reuse-app-checks.sh; then
            echo "PR verification lookup failed. Running app checks."
            echo 'verified=false' >> "$GITHUB_OUTPUT"
          fi

  policy:
    name: Git Flow policy
    needs: [changes, site, docs, personal-smoke, widget-smoke, installer]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate source branch and Conventional Commit PR title
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          set -euo pipefail
          title_pattern='^(feat|fix|docs|test|refactor|chore|perf|style|build|ci|revert)(\([a-z0-9._/-]+\))?!?: .+'

          if [[ ! "$PR_TITLE" =~ $title_pattern ]]; then
            echo "PR title must follow Conventional Commits, for example: feat(web): add room search"
            exit 1
          fi

          case "$BASE_BRANCH:$HEAD_BRANCH" in
            develop:feature/*|develop:release/*|develop:hotfix/*|develop:main|main:release/*|main:hotfix/*)
              ;;
            *)
              echo "Invalid Git Flow route: $HEAD_BRANCH -> $BASE_BRANCH"
              echo "Expected feature/* -> develop, release/* -> main, or hotfix/* -> main. Back-merges may target develop."
              exit 1
              ;;
          esac

      # This check already protects main. Require each routed job while letting
      # jobs for unaffected components skip.
      - name: Require each selected static, personal stack, widget and installer check
        env:
          ROUTING_RESULT: ${{ needs.changes.result }}
          APP_CHANGED: ${{ needs.changes.outputs.app }}
          PERSONAL_RESULT: ${{ needs.personal-smoke.result }}
          WIDGET_RESULT: ${{ needs.widget-smoke.result }}
          SITE_CHANGED: ${{ needs.changes.outputs.site }}
          SITE_RESULT: ${{ needs.site.result }}
          DOCS_CHANGED: ${{ needs.changes.outputs.docs }}
          DOCS_RESULT: ${{ needs.docs.result }}
          INSTALLER_CHANGED: ${{ needs.changes.outputs.installer }}
          INSTALLER_RESULT: ${{ needs.installer.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$ROUTING_RESULT" != success || ! "$APP_CHANGED" =~ ^(true|false)$ ]]; then
            echo "::error::Could not determine the changes that need checks."
            exit 1
          fi
          for lane in "site:$SITE_CHANGED:$SITE_RESULT" "docs:$DOCS_CHANGED:$DOCS_RESULT" \
              "personal:$APP_CHANGED:$PERSONAL_RESULT" "widget:$APP_CHANGED:$WIDGET_RESULT" \
              "installer:$INSTALLER_CHANGED:$INSTALLER_RESULT"; do
            case "$lane" in
              *:true:success|*:false:skipped) ;;
              *) echo "::error::Unexpected check result: $lane"; exit 1 ;;
            esac
          done

  check:
    name: Lint, typecheck & build
    needs: changes
    if: needs.changes.outputs.app == 'true' && needs.changes.outputs.verified != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:app
      - name: Build the app and verify its deployment artifacts
        env:
          LIVEKIT_DOMAIN: "lk$&x$'y.example.com"
        run: |
          npm run build:app
          WEB_DEPLOY_CONTRACT=built npm --workspace @voiceroom/web run test -- \
            test/deploy-contract.test.ts -t 'a production (web|widget) build keeps the deployment contract'

  # API and web tests run as separate jobs so neither waits for the other.
  test:
    name: API tests
    needs: changes
    if: needs.changes.outputs.app == 'true' && needs.changes.outputs.verified != 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Admin-capable URL: the API test harness creates and drops a temporary
      # database per integration test, so it needs CREATE DATABASE privileges.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run shared and API tests without coverage on push
        if: github.event_name == 'push'
        run: |
          npm --workspace @voiceroom/shared run test
          npm --workspace @voiceroom/api run test
      - name: Script tests and real Caddy log-redaction regression
        env:
          CADDY_TEST_IMAGE: caddy:2.11.4-alpine
        run: |
          docker pull "$CADDY_TEST_IMAGE"
          tests=()
          for test in scripts/test/*.test.mts; do
            # The routing job already runs its regression tests.
            if [[ "$test" == scripts/test/changed-components.test.mts ]]; then
              continue
            fi
            if [[ "$GITHUB_EVENT_NAME" == pull_request && "$test" == scripts/test/coverage-gate.test.mts ]]; then
              continue
            fi
            tests+=("$test")
          done
          node --test "${tests[@]}"
      - name: Capture protected-base coverage policy and changed files
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p coverage
          # Deleted files have no code left to measure; a .js module renamed to .ts
          # is measured under its new name.
          git diff --name-only --diff-filter=d "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > coverage/release-250-changed-files.txt
          git diff --unified=0 "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > coverage/release-250-changed.diff
          if git cat-file -e "${{ github.event.pull_request.base.sha }}:config/coverage/release-250-thresholds.json"; then
            git show "${{ github.event.pull_request.base.sha }}:config/coverage/release-250-thresholds.json" > coverage/release-250-base-thresholds.json
            echo "G08_BASELINE_ARGS=--base-thresholds coverage/release-250-base-thresholds.json" >> "$GITHUB_ENV"
          else
            echo "G08_BASELINE_ARGS=--base-thresholds-absent" >> "$GITHUB_ENV"
          fi
      - name: Run shared and API tests with G08 coverage
        if: github.event_name == 'pull_request'
        run: npm run coverage:g08
      - name: Enforce G08 coverage and protected-base ratchet
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          read -r -a baseline_args <<< "$G08_BASELINE_ARGS"
          node scripts/coverage/check-release-250-coverage.mts \
            --coverage coverage/release-250-summary.json \
            --changed-files coverage/release-250-changed-files.txt \
            --changed-diff coverage/release-250-changed.diff \
            "${baseline_args[@]}"
      - name: Persist G08 measured coverage artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v5
        with:
          name: g08-release-250-coverage-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}-head-${{ github.event.pull_request.head.sha }}
          path: |
            coverage/release-250-summary.json
            coverage/release-250-changed-files.txt
            coverage/release-250-changed.diff
            coverage/release-250-base-thresholds.json
          if-no-files-found: error
          retention-days: 90

  test-web:
    name: Web tests
    needs: changes
    if: needs.changes.outputs.app == 'true' && needs.changes.outputs.verified != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm --workspace @voiceroom/web run test
        env:
          WEB_DEPLOY_CONTRACT: checked
      - run: npm --workspace @voiceroom/admin run test
      - run: npm --workspace @voiceroom/meet run test
      - run: npm --workspace @voiceroom/widget run test

  voice-join:
    name: Voice room join smoke
    needs: changes
    if: needs.changes.outputs.app == 'true' && needs.changes.outputs.verified != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --workspace @voiceroom/web --workspace @voiceroom/shared --workspace @voiceroom/ui --workspace @voiceroom/ui-kit --workspace @voiceroom/call
      - name: Start the voice stack and pull the Playwright image
        env:
          VOICE_CALLS_ENABLED: "true"
        run: |
          version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          image="mcr.microsoft.com/playwright:v${version}-noble"
          docker pull "$image" &
          browser_pull=$!
          docker compose -f docker-compose.ci.yml up -d --build --wait --wait-timeout 180
          wait "$browser_pull"
          echo "PLAYWRIGHT_IMAGE=$image" >> "$GITHUB_ENV"
      - name: Join voice and verify chat behavior through production-like services
        run: |
          docker run --rm --init --network host --ipc host --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e CI -v "$GITHUB_WORKSPACE:/work" -w /work "$PLAYWRIGHT_IMAGE" \
            npm --workspace @voiceroom/web run e2e -- \
            e2e/room-voice.spec.ts e2e/rnnoise-assets.spec.ts e2e/microphone-recovery.spec.ts \
            e2e/chat-image-paste.spec.ts e2e/manual-chat-polish.spec.ts e2e/chat-drafts.spec.ts \
            e2e/chat-typing.spec.ts e2e/guest-account-cta.spec.ts e2e/mobile-room.spec.ts \
            e2e/friend-call.spec.ts \
            --project=chromium --retries=0
      # No teardown step: a hosted runner is discarded after the job together
      # with its containers and volumes.
      - name: Capture voice stack diagnostics
        if: failure()
        run: |
          docker compose -f docker-compose.ci.yml ps
          docker compose -f docker-compose.ci.yml logs --no-color --tail=250

  goal-g05:
    name: G05 strict LiveKit gate proof
    needs: changes
    if: needs.changes.outputs.app == 'true' && needs.changes.outputs.verified != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The API test job already runs the LiveKit boundary test file.
      - run: G05_SELECTED_MECHANISM=external-auth-gate node scripts/lkv/run-strict-boundary-proof.mts --json --fail-on-blocked

  widget-smoke:
    name: Embedded guest call and media boundary
    needs: changes
    if: needs.changes.outputs.app == 'true' && needs.changes.outputs.verified != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_WIDGET_COMPOSE_PROJECT: widget-ci-${{ github.run_id }}-${{ github.run_attempt }}
      PLAYWRIGHT_WIDGET_E2E: "1"
      PLAYWRIGHT_WIDGET_RECOVERY: "1"
      WIDGET_ENABLED: "true"
      CI_GATE_PUBLIC_URL: wss://localhost:19443
      CI_ROOM_CREATE_POW_DIFFICULTY: "4"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm --workspace @voiceroom/widget run build
      - name: Start the isolated widget API and SFU
        run: |
          docker compose -p "$PLAYWRIGHT_WIDGET_COMPOSE_PROJECT" -f docker-compose.ci.yml up -d --build --wait --wait-timeout 180 api
          docker compose -p "$PLAYWRIGHT_WIDGET_COMPOSE_PROJECT" -f docker-compose.ci.yml exec -T postgres \
            psql -v ON_ERROR_STOP=1 -U voice_room -d voice_room_ci \
            -c 'UPDATE widget_boundary_activation SET widget_boundary_required=true, widget_admission_enabled=true WHERE singleton'
      - name: Exercise frozen loader compatibility, reconnect and SFU denials
        run: |
          npm --workspace @voiceroom/web run e2e -- \
            e2e/widget-embed.spec.ts e2e/widget-media-boundary.spec.ts e2e/widget-reconnect.spec.ts
      - name: Report widget service states
        if: failure()
        run: |
          docker compose -p "$PLAYWRIGHT_WIDGET_COMPOSE_PROJECT" -f docker-compose.ci.yml ps --all
          docker compose -p "$PLAYWRIGHT_WIDGET_COMPOSE_PROJECT" -f docker-compose.ci.yml logs --no-color --timestamps api livekit-gate livekit > widget-services.log
          tail -n 200 widget-services.log
      - name: Keep widget traces and service logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: widget-e2e-${{ github.run_attempt }}
          path: |
            apps/web/test-results
            widget-services.log
          retention-days: 7
      - name: Remove widget stack resources
        if: always()
        run: docker compose -p "$PLAYWRIGHT_WIDGET_COMPOSE_PROJECT" -f docker-compose.ci.yml down -v --rmi local

  personal-smoke:
    name: Personal Compose smoke
    needs: changes
    if: needs.changes.outputs.app == 'true' && needs.changes.outputs.verified != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PERSONAL_SMOKE_PROJECT: personal-ci-${{ github.run_id }}-${{ github.run_attempt }}
      # Caddy issues the turn.localhost certificate from its local CA in CI.
      PERSONAL_DOMAIN: localhost
      PERSONAL_ORIGIN: http://127.0.0.1:5187
      PERSONAL_CADDY_SITE: http://127.0.0.1
      PERSONAL_SIGNAL_URL: ws://127.0.0.1:5187
      PERSONAL_BIND_HOST: 127.0.0.1
      PERSONAL_HTTP_PORT: "5187"
      PERSONAL_HTTPS_PORT: "5443"
      PERSONAL_LIVEKIT_EXTERNAL_IP: "false"
      PERSONAL_LIVEKIT_NODE_IP: 127.0.0.1
      PERSONAL_POSTGRES_PASSWORD: personal-ci-password
      PERSONAL_GATE_SECRET: personal-ci-gate-secret-at-least-32-bytes
      PERSONAL_LIVEKIT_API_KEY: personal-ci-key
      PERSONAL_LIVEKIT_API_SECRET: personal-ci-livekit-secret-at-least-32-bytes
      PERSONAL_ROOM_IDLE_TTL_MS: "10000"
      PERSONAL_ROOM_PRUNE_INTERVAL_MS: "250"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --workspace @voiceroom/api --workspace @voiceroom/meet --workspace @voiceroom/shared --workspace @voiceroom/ui --workspace @voiceroom/ui-kit --workspace @voiceroom/call
      - run: npx playwright install --with-deps chromium
      - name: Start the personal stack with clean project volumes
        run: docker compose -p "$PERSONAL_SMOKE_PROJECT" -f docker-compose.personal.yml up -d --build --wait --wait-timeout 120
      - run: node --test scripts/ci/personal-compose-smoke.test.mts
      - name: Exercise a two-guest Meet call through Caddy
        run: npm --workspace @voiceroom/meet run e2e
      - name: Report personal service states
        if: failure()
        run: docker compose -p "$PERSONAL_SMOKE_PROJECT" -f docker-compose.personal.yml ps --all
      - name: Remove personal stack resources
        if: always()
        run: |
          docker compose -p "$PERSONAL_SMOKE_PROJECT" -f docker-compose.personal.yml down -v --rmi local
          if docker image inspect "$PERSONAL_SMOKE_PROJECT-api" >/dev/null 2>&1; then
            docker image rm "$PERSONAL_SMOKE_PROJECT-api"
          fi

  installer:
    name: Meet installer and CLI tests
    needs: changes
    if: needs.changes.outputs.installer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: sudo python3 -B -m unittest discover -s apps/get/test -v

  record-app-checks:
    name: Record verified application tree
    needs: [changes, policy, check, test, test-web, voice-join, widget-smoke, goal-g05]
    if: github.event_name == 'pull_request' && github.base_ref == 'develop' && needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Record the tested tree
        id: tree
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "name=verified-dev-pr-$PR_NUMBER-$BASE_SHA-$tree-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$tree" > verified-tree.txt
      - uses: actions/upload-artifact@v6
        # A storage failure only disables check reuse on the subsequent push.
        continue-on-error: true
        with:
          name: ${{ steps.tree.outputs.name }}
          path: verified-tree.txt
          if-no-files-found: error
          retention-days: 7

  images:
    name: Publish images
    needs: [changes, check, test, test-web, voice-join, widget-smoke, goal-g05, personal-smoke, installer]
    if: >-
      !cancelled() && github.event_name == 'push' && needs.changes.result == 'success' &&
      needs.changes.outputs.app == 'true' &&
      (needs.changes.outputs.installer == 'false' || needs.installer.result == 'success') &&
      (needs.changes.outputs.verified == 'true' ||
      (needs.check.result == 'success' && needs.test.result == 'success' &&
      needs.test-web.result == 'success' && needs.voice-join.result == 'success' && needs.widget-smoke.result == 'success' &&
      needs.goal-g05.result == 'success' && needs.personal-smoke.result == 'success'))
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml

  client-artifacts:
    needs: images
    if: ${{ !cancelled() && github.event_name == 'push' && needs.images.result == 'success' }}
    uses: ./.github/workflows/build-client.yml
    with:
      component: all

  deploy-dev:
    name: Deploy dev
    needs: [images, client-artifacts]
    # Publication can succeed after skipping the individual app checks.
    if: ${{ !cancelled() && github.event_name == 'push' && needs.images.result == 'success' && needs.client-artifacts.result == 'success' }}
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
      url: https://dev.voiceroom.ru
    secrets: inherit

  deploy-clients-dev:
    name: Deploy dev ${{ matrix.component }}
    needs: deploy-dev
    # Skipped checks earlier in the chain would otherwise skip this job too.
    if: ${{ !cancelled() && needs.deploy-dev.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        component: [admin, widget]
    uses: ./.github/workflows/deploy-client.yml
    with:
      component: ${{ matrix.component }}
      environment: dev
    secrets: inherit

  static-publication:
    name: Static publication checks
    needs: changes
    if: needs.changes.outputs.site == 'true' || needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash scripts/test/static-publication.sh

  site:
    name: Site checks
    needs: [changes, static-publication]
    if: needs.changes.outputs.site == 'true'
    uses: ./.github/workflows/build-static.yml
    with:
      component: site
      check-publication: false

  docs:
    name: Docs checks
    needs: [changes, static-publication]
    if: needs.changes.outputs.docs == 'true'
    uses: ./.github/workflows/build-static.yml
    with:
      component: docs
      check-publication: false

  deploy-site-dev:
    name: Deploy site to dev
    needs: site
    if: github.event_name == 'push'
    uses: ./.github/workflows/deploy-static.yml
    with:
      component: site
      environment: dev
    secrets: inherit

  deploy-docs-dev:
    name: Deploy docs to dev
    needs: docs
    if: github.event_name == 'push'
    uses: ./.github/workflows/deploy-static.yml
    with:
      component: docs
      environment: dev
    secrets: inherit
