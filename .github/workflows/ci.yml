          NODE
          subject_run_id="$(node -p 'JSON.parse(require("node:fs").readFileSync("backfill-context.json")).run.id')"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$subject_run_id/jobs?filter=latest&per_page=100" --slurp > backfill-subject-job-pages.json
          failed_job_id="$(node -p 'const x=JSON.parse(require("node:fs").readFileSync("backfill-subject-job-pages.json")).flatMap(x=>x.jobs??[]).filter(x=>x.name==="G01 authenticated post-merge F11"&&x.conclusion==="failure");if(x.length!==1)throw Error("unique failed F11 job absent");x[0].id')"
          gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$failed_job_id/logs" > backfill-subject-f11.log
          for phase in f7 f9; do id="$(PHASE="$phase" node -p 'JSON.parse(require("node:fs").readFileSync("backfill-context.json")).pair[process.env.PHASE].id')"; gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "backfill-$phase.zip"; rm -rf "/tmp/g01-backfill-$phase"; mkdir "/tmp/g01-backfill-$phase"; unzip -q "backfill-$phase.zip" -d "/tmp/g01-backfill-$phase"; done
          node --input-type=module - <<'NODE'
          import fs from'node:fs';import c from'node:crypto';import {validateArtifactlessBackfillAuthority,validateBootstrapFailure}from'./scripts/evidence/emit-bootstrap-selection.mjs';const read=p=>JSON.parse(fs.readFileSync(p)),hash=b=>'sha256:'+c.createHash('sha256').update(b).digest('hex'),x=read('backfill-context.json'),jobs=read('backfill-subject-job-pages.json').flatMap(x=>x.jobs??[]),producer=read('backfill-producer-run.json'),producerJobs=read('backfill-producer-job-pages.json').flatMap(x=>x.jobs??[]),names=['Lint, typecheck & build','Tests','G01 authenticated post-merge F11'],allChecks=read('backfill-subject-check-runs.json').check_runs,checks=names.map(name=>{const m=allChecks.filter(r=>r.name===name&&r.check_suite?.id===x.run.check_suite_id);if(m.length!==1)throw Error('subject check ambiguity');const r=m[0];return{id:r.id,name:r.name,status:r.status,conclusion:r.conclusion,detailsUrl:r.details_url,checkSuiteId:r.check_suite?.id}}),required=names.map(name=>{const m=jobs.filter(x=>x.name===name);if(m.length!==1)throw Error('subject job ambiguity');return{id:m[0].id,name,status:m[0].status,conclusion:m[0].conclusion}}),failure=validateBootstrapFailure({schemaVersion:1,release:'2.5.0',status:'G01_LANDED_UNSEALED',attemptId:x.pair.attemptId,evidenceId:`bootstrap-failure.${x.pair.attemptId}.json`,failedPhase:'F11',baseSha:x.pr.base.sha,parentSha:x.pr.base.sha,terminalDevelopSha:x.run.head_sha,headSha:x.pr.head.sha,runId:x.run.id,runAttempt:x.run.run_attempt,createdAt:new Date().toISOString(),reason:'authenticated subject run completed without a failure artifact',recoveryLineage:[]});const artifact=(phase,meta)=>{const dir=`/tmp/g01-backfill-${phase}`,files=fs.readdirSync(dir),name=files.find(n=>phase==='f7'?/^ci-bundle\..+\.json$/.test(n):/^approval-envelope\..+\.json$/.test(n));if(!name)throw Error('payload absent');return{id:meta.id,name:meta.name,archiveDigest:hash(fs.readFileSync(`backfill-${phase}.zip`)),payloadDigest:hash(fs.readFileSync(`${dir}/${name