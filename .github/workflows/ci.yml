name: CI/CD

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
permissions:
  contents: read

# Cancel superseded runs on PRs; push runs on develop/main always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  policy:
    name: Git Flow policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate source branch and Conventional Commit PR title
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          set -euo pipefail
          title_pattern='^(feat|fix|docs|test|refactor|chore|perf|style|build|ci|revert)(\([a-z0-9._/-]+\))?!?: .+'

          if [[ ! "$PR_TITLE" =~ $title_pattern ]]; then
            echo "PR title must follow Conventional Commits, for example: feat(web): add room search"
            exit 1
          fi

          case "$BASE_BRANCH:$HEAD_BRANCH" in
            develop:feature/*|develop:release/*|develop:hotfix/*|develop:main|main:release/*|main:hotfix/*)
              ;;
            *)
              echo "Invalid Git Flow route: $HEAD_BRANCH -> $BASE_BRANCH"
              echo "Expected feature/* -> develop, release/* -> main, or hotfix/* -> main. Back-merges may target develop."
              exit 1
              ;;
          esac

  check:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Admin-capable URL: the API test harness creates and drops a temporary
      # database per integration test, so it needs CREATE DATABASE privileges.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  voice-join:
    name: Voice room join smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start production-like voice stack
        run: docker compose -f docker-compose.ci.yml up -d --build --wait --wait-timeout 180
      - name: Join voice and verify chat behavior through production-like services
        run: npm --workspace @voice-room/web run e2e -- e2e/room-voice.spec.ts e2e/chat-image-paste.spec.ts e2e/manual-chat-polish.spec.ts --project=chromium --retries=0
      - name: Capture voice stack diagnostics
        if: failure()
        run: |
          docker compose -f docker-compose.ci.yml ps
          docker compose -f docker-compose.ci.yml logs --no-color --tail=250
      - name: Always tear down the voice stack
        if: always()
        run: docker compose -f docker-compose.ci.yml down --volumes --remove-orphans

  goal-g05:
    name: G05 strict LiveKit gate proof
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm --workspace @voice-room/api run test:g05
      - run: G05_SELECTED_MECHANISM=external-auth-gate node scripts/lkv/run-strict-boundary-proof.mjs --json --fail-on-blocked

  goal-g08:
    name: G08 measured coverage gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    permissions:
      contents: read
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Capture protected-base coverage policy and changed files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p coverage
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > coverage/release-250-changed-files.txt
          git diff --unified=0 "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > coverage/release-250-changed.diff
          if git cat-file -e "${{ github.event.pull_request.base.sha }}:config/coverage/release-250-thresholds.json"; then
            git show "${{ github.event.pull_request.base.sha }}:config/coverage/release-250-thresholds.json" > coverage/release-250-base-thresholds.json
            echo "G08_BASELINE_ARGS=--base-thresholds coverage/release-250-base-thresholds.json" >> "$GITHUB_ENV"
          else
            echo "G08_BASELINE_ARGS=--base-thresholds-absent" >> "$GITHUB_ENV"
          fi
      - run: npm run coverage:g08
      - name: Enforce G08 coverage and protected-base ratchet
        shell: bash
        run: |
          read -r -a baseline_args <<< "$G08_BASELINE_ARGS"
          node scripts/coverage/check-release-250-coverage.mjs \
            --coverage coverage/release-250-summary.json \
            --changed-files coverage/release-250-changed-files.txt \
            --changed-diff coverage/release-250-changed.diff \
            "${baseline_args[@]}"
      - name: Persist G08 measured coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: g08-release-250-coverage-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}-head-${{ github.event.pull_request.head.sha }}
          path: |
            coverage/release-250-summary.json
            coverage/release-250-changed-files.txt
            coverage/release-250-changed.diff
            coverage/release-250-base-thresholds.json
          if-no-files-found: error
          retention-days: 90
