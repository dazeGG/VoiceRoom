name: CI/CD

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      bootstrap_phase:
        description: Authenticated lifecycle phase to emit
        required: true
        type: choice
        options: [approval, merge, selection]
      bootstrap_pr_number:
        description: G01 pull request number (verified through GitHub API)
        required: true
        type: number
      bootstrap_f7_artifact_id:
        description: Immutable F7 Actions artifact ID
        required: true
        type: number
      bootstrap_f9_artifact_id:
        description: Immutable F9 Actions artifact ID (merge/selection only)
        required: false
        type: number
      bootstrap_f11_artifact_id:
        description: Immutable F11 Actions artifact ID (selection only)
        required: false
        type: number
      bootstrap_postmerge_run_id:
        description: Completed green develop run ID (merge/selection only)
        required: false
        type: number
      bootstrap_ancestor_artifact_id:
        description: Immutable ordered recovery-failure chain artifact ID
        required: false
        type: number

permissions:
  contents: read

# Cancel superseded runs on PRs; never cancel a main run (it may be mid-deploy).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  policy:
    name: Git Flow policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate source branch and Conventional Commit PR title
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          set -euo pipefail
          title_pattern='^(feat|fix|docs|test|refactor|chore|perf|style|build|ci|revert)(\([a-z0-9._/-]+\))?!?: .+'

          if [[ ! "$PR_TITLE" =~ $title_pattern ]]; then
            echo "PR title must follow Conventional Commits, for example: feat(web): add room search"
            exit 1
          fi

          case "$BASE_BRANCH:$HEAD_BRANCH" in
            develop:feature/*|develop:release/*|develop:hotfix/*|develop:main|main:release/*|main:hotfix/*)
              ;;
            *)
              echo "Invalid Git Flow route: $HEAD_BRANCH -> $BASE_BRANCH"
              echo "Expected feature/* -> develop, release/* -> main, or hotfix/* -> main. Back-merges may target develop."
              exit 1
              ;;
          esac

  check:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Admin-capable URL: the API test harness creates and drops a temporary
      # database per integration test, so it needs CREATE DATABASE privileges.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  bootstrap-plan:
    name: G01 bootstrap plan
    if: (github.event_name == 'pull_request' && (github.head_ref == 'feature/2.5.0-g01-canonical-evidence-bootstrap' || startsWith(github.head_ref, 'feature/2.5.0-g01-postmerge-bootstrap-a'))) || (github.event_name == 'push' && (github.ref_name == 'feature/2.5.0-g01-canonical-evidence-bootstrap' || startsWith(github.ref_name, 'feature/2.5.0-g01-postmerge-bootstrap-a')))
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validate canonical plan and bootstrap contracts
        run: |
          python3 scripts/test/validate_release_250_plan.py docs/RELEASE_2.5.0_PLAN.md docs/RELEASE_2.5.0_TEST_SPEC.md
          node --test scripts/test/g01-release-docs.test.mjs scripts/test/g01-oras-lock.test.mjs
          node --test scripts/test/g01-landed-bootstrap-recovery.test.mjs
          node scripts/evidence/recover-landed-bootstrap.mjs --fixture scripts/test/fixtures/g01-landed-bootstrap-recovery.json --validate-only
          node scripts/evidence/validate-envelope.mjs --fixture bootstrap
          scripts/ci/run-actionlint.sh .github/workflows/ci.yml
          scripts/ci/run-oras.sh version
      - name: Export candidate-only G01 report and F7 envelope
        run: |
          if test "$SOURCE_BRANCH" = feature/2.5.0-g01-canonical-evidence-bootstrap; then suffix=g01.json; else suffix="bootstrap-recovery-${SOURCE_BRANCH##*-bootstrap-}.json"; fi
          node scripts/evidence/bootstrap-export.mjs docs/releases/2.5.0/evidence/bootstrap-attempts.json docs/releases/2.5.0/evidence/bootstrap-landed-recoveries.json > candidate-registry-report.g01.json
          node scripts/evidence/bootstrap-export.mjs --f7 --source-sha "$SOURCE_SHA" --created-at "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" --lineage-suffix "$suffix" docs/releases/2.5.0/evidence/bootstrap-attempts.json docs/releases/2.5.0/evidence/bootstrap-landed-recoveries.json > "ci-bundle.$suffix"
      - name: Persist G01 F7 evidence
        uses: actions/upload-artifact@v4
        with:
          name: g01-candidate-evidence-${{ env.SOURCE_SHA }}
          path: |
            ci-bundle.*.json
            candidate-registry-report.g01.json
          if-no-files-found: error
          retention-days: 90
      - name: Await exact-head independent approvals and emit F9
        shell: bash
        run: |
          set -euo pipefail
          suffix=g01.json
          if test "$SOURCE_BRANCH" != feature/2.5.0-g01-canonical-evidence-bootstrap; then suffix="bootstrap-recovery-${SOURCE_BRANCH##*-bootstrap-}.json"; fi
          artifact_name="g01-candidate-evidence-${SOURCE_SHA}"
          for attempt in $(seq 1 90); do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$artifact_name" > run-artifacts.json
            node - <<'NODE'
          const fs = require('node:fs');
          const response = JSON.parse(fs.readFileSync('run-artifacts.json'));
          const matches = response.artifacts.filter((artifact) => artifact.name === process.env.ARTIFACT_NAME && artifact.expired === false);
          if (matches.length === 0) process.exit(0);
          if (matches.length !== 1) throw new Error('expected exactly one F7 artifact for this run');
          fs.writeFileSync('f7-artifact.json', JSON.stringify(matches[0]));
          NODE
            if test -s f7-artifact.json; then
              gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > pr.json
              gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews?per_page=100" --slurp > review-pages.json
              node - <<'NODE'
          const fs=require('node:fs'); const read=(p)=>JSON.parse(fs.readFileSync(p));
          fs.writeFileSync('approval-authority.json', JSON.stringify({pr:read('pr.json'),reviews:read('review-pages.json').flat(),observedAt:new Date().toISOString(),f7Artifact:read('f7-artifact.json'),candidateReport:read('candidate-registry-report.g01.json')}));
          NODE
              if node scripts/evidence/emit-bootstrap-selection.mjs --emit-f9 --f7 "ci-bundle.$suffix" --authority approval-authority.json > "approval-envelope.$suffix"; then break; fi
            fi
            rm -f f7-artifact.json approval-authority.json "approval-envelope.$suffix"
            if test "$attempt" = 90; then echo "Timed out waiting for exact-head OMX approvals" >&2; exit 1; fi
            sleep 20
          done
        env:
          ARTIFACT_NAME: g01-candidate-evidence-${{ env.SOURCE_SHA }}
      - name: Persist immutable G01 F9 from candidate PR run
        uses: actions/upload-artifact@v4
        with:
          name: g01-approval-${{ env.PR_NUMBER }}
          path: approval-envelope.*.json
          if-no-files-found: error
          retention-days: 90

  bootstrap-approval:
    name: G01 authenticated F9 approval seal
    if: github.event_name == 'workflow_dispatch' && inputs.bootstrap_phase == 'approval'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ inputs.bootstrap_pr_number }}
      F7_ARTIFACT_ID: ${{ inputs.bootstrap_f7_artifact_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Fetch immutable F7 and exact-head review authority
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$F7_ARTIFACT_ID" > f7-artifact.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$F7_ARTIFACT_ID/zip" > f7.zip
          unzip -q f7.zip
          f7_file="$(find . -maxdepth 1 -name 'ci-bundle.*.json' -print -quit)"; test -n "$f7_file"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > pr.json
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews?per_page=100" --slurp > review-pages.json
          node - <<'NODE'
          const fs=require('node:fs'); const read=(p)=>JSON.parse(fs.readFileSync(p));
          const pages=read('review-pages.json');
          fs.writeFileSync('approval-authority.json', JSON.stringify({pr:read('pr.json'),reviews:pages.flat(),observedAt:new Date().toISOString(),f7Artifact:read('f7-artifact.json'),candidateReport:read('candidate-registry-report.g01.json')}));
          NODE
          f9_file="${f7_file/ci-bundle/approval-envelope}"
          node scripts/evidence/emit-bootstrap-selection.mjs --emit-f9 --f7 "$f7_file" --authority approval-authority.json > "$f9_file"
      - name: Persist immutable G01 F9
        uses: actions/upload-artifact@v4
        with:
          name: g01-approval-${{ inputs.bootstrap_pr_number }}
          path: approval-envelope.*.json
          if-no-files-found: error
          retention-days: 90

  bootstrap-merge:
    name: G01 authenticated post-merge F11
    if: github.event_name == 'workflow_dispatch' && inputs.bootstrap_phase == 'merge'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ inputs.bootstrap_pr_number }}
      F7_ARTIFACT_ID: ${{ inputs.bootstrap_f7_artifact_id }}
      F9_ARTIFACT_ID: ${{ inputs.bootstrap_f9_artifact_id }}
      POSTMERGE_RUN_ID: ${{ inputs.bootstrap_postmerge_run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Fetch immutable envelopes and actual GitHub merge authority
        run: |
          set -euo pipefail
          test -n "$F9_ARTIFACT_ID" && test -n "$POSTMERGE_RUN_ID"
          for pair in "f7:$F7_ARTIFACT_ID" "f9:$F9_ARTIFACT_ID"; do
            name="${pair%%:*}"; id="${pair#*:}"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" > "$name-artifact.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$name.zip"
            unzip -q "$name.zip"
          done
          f7_file="$(find . -maxdepth 1 -name 'ci-bundle.*.json' -print -quit)"; f9_file="$(find . -maxdepth 1 -name 'approval-envelope.*.json' -print -quit)"
          test -n "$f7_file" && test -n "$f9_file"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > pr.json
          gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/develop" > develop-ref.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$POSTMERGE_RUN_ID" > postmerge-run.json
          branch="$(node -p 'JSON.parse(require("node:fs").readFileSync("pr.json")).head.ref')"
          encoded="$(node -p 'encodeURIComponent(process.argv[1])' "$branch")"
          status="$(curl --proto '=https' --tlsv1.2 -sS -o source-ref.json -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/$encoded")"
          test "$status" = 404
          SOURCE_REF_STATUS="$status" node - <<'NODE'
          const fs=require('node:fs'); const read=(p)=>JSON.parse(fs.readFileSync(p));
          fs.writeFileSync('merge-authority.json', JSON.stringify({pr:read('pr.json'),developRef:read('develop-ref.json'),sourceRefStatus:Number(process.env.SOURCE_REF_STATUS),postMergeRun:read('postmerge-run.json'),observedAt:new Date().toISOString(),f7Artifact:read('f7-artifact.json'),f9Artifact:read('f9-artifact.json')}));
          NODE
          f11_file="${f7_file/ci-bundle/merge-envelope}"
          node scripts/evidence/emit-bootstrap-selection.mjs --emit-f11 --f7 "$f7_file" --f9 "$f9_file" --authority merge-authority.json > "$f11_file"
      - name: Persist immutable G01 F11
        uses: actions/upload-artifact@v4
        with:
          name: g01-merge-${{ inputs.bootstrap_pr_number }}
          path: merge-envelope.*.json
          if-no-files-found: error
          retention-days: 90

  bootstrap-selection:
    name: G01 authenticated post-F11 terminal selection
    if: github.event_name == 'workflow_dispatch' && inputs.bootstrap_phase == 'selection'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ inputs.bootstrap_pr_number }}
      F7_ARTIFACT_ID: ${{ inputs.bootstrap_f7_artifact_id }}
      F9_ARTIFACT_ID: ${{ inputs.bootstrap_f9_artifact_id }}
      F11_ARTIFACT_ID: ${{ inputs.bootstrap_f11_artifact_id }}
      POSTMERGE_RUN_ID: ${{ inputs.bootstrap_postmerge_run_id }}
      ANCESTOR_ARTIFACT_ID: ${{ inputs.bootstrap_ancestor_artifact_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Re-fetch immutable artifacts and current terminal authority
        run: |
          set -euo pipefail
          test -n "$F9_ARTIFACT_ID" && test -n "$F11_ARTIFACT_ID" && test -n "$POSTMERGE_RUN_ID"
          for pair in "f7:$F7_ARTIFACT_ID" "f9:$F9_ARTIFACT_ID" "f11:$F11_ARTIFACT_ID"; do
            name="${pair%%:*}"; id="${pair#*:}"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" > "$name-artifact.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$name.zip"
            unzip -q "$name.zip"
          done
          f7_file="$(find . -maxdepth 1 -name 'ci-bundle.*.json' -print -quit)"; f9_file="$(find . -maxdepth 1 -name 'approval-envelope.*.json' -print -quit)"; f11_file="$(find . -maxdepth 1 -name 'merge-envelope.*.json' -print -quit)"
          test -n "$f7_file" && test -n "$f9_file" && test -n "$f11_file"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > pr.json
          gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/develop" > develop-ref.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$POSTMERGE_RUN_ID" > postmerge-run.json
          branch="$(node -p 'JSON.parse(require("node:fs").readFileSync("pr.json")).head.ref')"
          encoded="$(node -p 'encodeURIComponent(process.argv[1])' "$branch")"
          status="$(curl --proto '=https' --tlsv1.2 -sS -o source-ref.json -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/$encoded")"
          test "$status" = 404
          SOURCE_REF_STATUS="$status" node - <<'NODE'
          const fs=require('node:fs'); const read=(p)=>JSON.parse(fs.readFileSync(p));
          fs.writeFileSync('selection-authority.json', JSON.stringify({pr:read('pr.json'),developRef:read('develop-ref.json'),sourceRefStatus:Number(process.env.SOURCE_REF_STATUS),postMergeRun:read('postmerge-run.json'),observedAt:new Date().toISOString(),f7Artifact:read('f7-artifact.json'),f9Artifact:read('f9-artifact.json'),f11Artifact:read('f11-artifact.json')}));
          NODE
          extra=()
          if test -n "$ANCESTOR_ARTIFACT_ID"; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ANCESTOR_ARTIFACT_ID" > ancestor-artifact.json
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ANCESTOR_ARTIFACT_ID/zip" > ancestors.zip
            ANCESTOR_ARTIFACT_ID="$ANCESTOR_ARTIFACT_ID" node - <<'NODE'
          const fs=require('node:fs'); const crypto=require('node:crypto');
          const artifact=JSON.parse(fs.readFileSync('ancestor-artifact.json'));
          if (artifact.id !== Number(process.env.ANCESTOR_ARTIFACT_ID) || artifact.expired !== false) throw new Error('ancestor chain artifact metadata mismatch');
          const digest=`sha256:${crypto.createHash('sha256').update(fs.readFileSync('ancestors.zip')).digest('hex')}`;
          if (artifact.digest !== digest) throw new Error('ancestor chain archive digest mismatch');
          NODE
            unzip -q ancestors.zip
            : > ancestor-artifacts.ndjson
            while read -r artifact_id; do
              gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" >> ancestor-artifacts.ndjson
              printf '\n' >> ancestor-artifacts.ndjson
            done < <(node -e 'for (const item of JSON.parse(require("node:fs").readFileSync("bootstrap-ancestor-failures.json"))) console.log(item.artifactId)')
            node - <<'NODE'
          const fs=require('node:fs');
          const artifacts=fs.readFileSync('ancestor-artifacts.ndjson','utf8').trim().split('\n').filter(Boolean).map(JSON.parse);
          fs.writeFileSync('ancestor-artifacts.json', JSON.stringify(artifacts));
          NODE
            extra=(--ancestors bootstrap-ancestor-failures.json --ancestor-artifacts ancestor-artifacts.json)
          fi
          node scripts/evidence/emit-bootstrap-selection.mjs --f7 "$f7_file" --f9 "$f9_file" --f11 "$f11_file" --authority selection-authority.json "${extra[@]}" > bootstrap-selection.json
      - name: Persist post-F11 bootstrap selection
        uses: actions/upload-artifact@v4
        with:
          name: g01-bootstrap-selection-${{ inputs.bootstrap_pr_number }}
          path: bootstrap-selection.json
          if-no-files-found: error
          retention-days: 90

  deploy:
    name: Deploy to server
    needs: [check, test]
    # Only deploy real pushes to main, never PRs or forks.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Serialize deploys so two pushes can't rebuild the stack concurrently.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            set -euo pipefail
            cd "${{ vars.DEPLOY_PATH || '/srv/voiceroom' }}"
            git fetch --all --prune
            git reset --hard origin/main
            # API applies PostgreSQL migrations on bootstrap before it listens.
            docker compose up -d --build
            docker image prune -f
