          const fs=require('node:fs');const p=JSON.parse(fs.readFileSync('pr.json')),attempt=process.env.ATTEMPT_ID;const o={schemaVersion:1,release:'2.5.0',status:'G01_LANDED_UNSEALED',attemptId:attempt,evidenceId:`bootstrap-failure.${attempt}.json`,failedPhase:'SELECTION',baseSha:p.base.sha,parentSha:p.base.sha,terminalDevelopSha:process.env.GITHUB_SHA,headSha:p.head.sha,runId:Number(process.env.GITHUB_RUN_ID),runAttempt:Number(process.env.GITHUB_RUN_ATTEMPT),createdAt:new Date().toISOString(),reason:'post-F11 selection production or upload failed closed'};fs.writeFileSync(o.evidenceId,JSON.stringify(o)+'\n');
          NODE
      - name: Persist immutable landed-unsealed selection failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: g01-bootstrap-failure-${{ env.ATTEMPT_ID }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}-head-${{ github.sha }}-phase-selection
          path: bootstrap-failure.*.json
          if-no-files-found: error
          retention-days: 90

  deploy:
    name: Deploy to server
    needs: [check, test]
    # Only deploy real pushes to main, never PRs or forks.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Serialize deploys so two pushes can't rebuild the stack concurrently.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            set -euo pipefail
            cd "${{ vars.DEPLOY_PATH || '/srv/voiceroom' }}"
            git fetch --all --prune
            git reset --hard origin/main
            # API applies PostgreSQL migrations on bootstrap before it listens.
            docker compose up -d --build
            docker image prune -f
