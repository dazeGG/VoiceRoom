name: CI/CD

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
permissions:
  contents: read

# Cancel superseded runs on PRs; never cancel a main run (it may be mid-deploy).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bootstrap-artifactless-backfill:
    name: G01 authenticated artifactless failure backfill
    if: github.event_name == 'pull_request' && github.base_ref == 'develop' && github.head_ref == 'feature/g01-artifactless-backfill' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Produce standard failure payload and authenticated backfill sidecar
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > backfill-producer-run.json
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" --slurp > backfill-producer-job-pages.json
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=push&branch=develop&per_page=100" --slurp > backfill-push-run-pages.json
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --slurp > backfill-artifact-pages.json
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=pull_request&per_page=100" --slurp > backfill-pr-run-pages.json
          base_sha="${{ github.event.pull_request.base.sha }}"
          gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/commits/$base_sha/pulls" > backfill-subject-prs.json
          gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/commits/$base_sha/check-runs?per_page=100" > backfill-subject-check-runs.json
          BASE_SHA="$base_sha" node - <<'NODE'
          const fs=require('node:fs'),c=require('node:crypto'),a=require('node:assert/strict'),read=p=>JSON.parse(fs.readFileSync(p)),hash=x=>'sha256:'+c.createHash('sha256').update(x).digest('hex');const pages=read('backfill-artifact-pages.json'),runs=read('backfill-push-run-pages.json').flatMap(x=>x.workflow_runs??[]).filter(x=>x.head_sha===process.env.BASE_SHA&&x.head_branch==='develop'&&x.event==='push'&&x.path==='.github/workflows/ci.yml'&&x.status==='completed'&&x.conclusion&&x.conclusion!=='success').sort((x,y)=>y.run_attempt-x.run_attempt||y.id-x.id);a.equal(runs.length,1);const run=runs[0],prs=read('backfill-subject-prs.json').filter(p=>p.state==='closed'&&p.merged_at&&p.merge_commit_sha===run.head_sha&&p.base?.ref==='develop'&&p.base?.repo?.full_name===process.env.GITHUB_REPOSITORY&&p.head?.repo?.full_name===process.env.GITHUB_REPOSITORY);a.equal(prs.length,1);const pr=prs[0],all=pages.flatMap(x=>x.artifacts??[]),failureRe=new RegExp(`^g01-bootstrap-failure-g01-(?:recovery-)?a[0-9]{2,}-run-${run.id}-attempt-${run.run_attempt}-head-${run.head_sha}-phase-(?:f11|selection)$`),matching=all.filter(x=>failureRe.test(x.name??''));a.deepEqual(matching,[]);const candidateRe=new RegExp(`^g01-candidate-(g01-(?:recovery-)?a[0-9]{2,})-run-([1-9][0-9]*)-attempt-([1-9][0-9]*)-head-${pr.head.sha}$`),prRuns=read('backfill-pr-run-pages.json').flatMap(x=>x.workflow_runs??[]),pairs=[];for(const f7 of all.filter(x=>!x.expired&&candidateRe.test(x.name??''))){const m=f7.name.match(candidateRe),f9=all.filter(x=>!x.expired&&x.name===`g01-approval-${m[1]}-run-${m[2]}-attempt-${m[3]}-head-${pr.head.sha}`&&x.workflow_run?.id===f7.workflow_run?.id),r=prRuns.filter(x=>x.id===Number(m[2])&&x.run_attempt===Number(m[3])&&x.head_sha===pr.head.sha&&x.status==='completed'&&x.conclusion==='success');if(f9.length===1&&r.length===1)pairs.push({attemptId:m[1],f7,f9:f9[0],runId:Number(m[2]),runAttempt:Number(m[3])})}pairs.sort((x,y)=>y.runAttempt-x.runAttempt||y.runId-x.runId);a.ok(pairs.length);