      - name: Persist G02 F7 and clean-stack reports
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.G02_F7_NAME }}
          path: |
            ci-bundle.g02.json
            g02-reports/
          if-no-files-found: error
          retention-days: 90
      - name: Always tear down the isolated stack
        if: always()
        run: docker compose -f docker-compose.ci.yml down --volumes --remove-orphans

  goal-g02-seal:
    name: G02 authenticated F9 approval seal
    needs: [policy, check, test, goal-g02]
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/2.5.0-g02-autonomous-ci-foundation' && github.event.pull_request.head.repo.full_name == github.repository
    environment: g02-approval-authority
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REVIEW_TRANSPORT_ACTOR_ID: ${{ vars.OMX_G02_REVIEW_TRANSPORT_ACTOR_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Authenticate exact-head review comments and emit F9
        shell: bash
        run: |
          set -euo pipefail
