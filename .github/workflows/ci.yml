  goal-g02:
    name: G02 autonomous clean-stack verification
    if: github.event_name == 'pull_request' && github.base_ref == 'develop' && github.head_ref == 'feature/2.5.0-g02-autonomous-ci-foundation' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      SOURCE_BRANCH: ${{ github.head_ref }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      SELECTION_ARTIFACT_ID: 8442115507
      SELECTION_FILE: bootstrap-selection.g01-recovery-a27.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Authenticate exact terminal bootstrap selection and G01 envelope bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p g02-authority
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SELECTION_ARTIFACT_ID" > g02-authority/selection-metadata.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SELECTION_ARTIFACT_ID/zip" > g02-authority/selection.zip
