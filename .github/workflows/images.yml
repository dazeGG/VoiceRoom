name: Publish images

# Called from ci.yml for develop and from release.yml for main and tags. The
# cache scope is the same everywhere: a tag can restore Docker layers from the
# default branch but not from an earlier tag.
on:
  workflow_call:

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: Publish ${{ matrix.target == 'api' && 'api and worker images' || 'web image' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [api, web]
    env:
      # Keep build summaries without storing per-build record artifacts.
      DOCKER_BUILD_RECORD_UPLOAD: false
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
        id: buildx
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish ${{ matrix.target }} image
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ghcr.io/dazegg/voiceroom-${{ matrix.target }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
      # The worker inherits the API filesystem and changes only its command.
      # Use the same builder to reuse those layers without a second cache export.
      - name: Publish worker image
        if: matrix.target == 'api'
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          target: worker
          push: true
          tags: ghcr.io/dazegg/voiceroom-worker:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
