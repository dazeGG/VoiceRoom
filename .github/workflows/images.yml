name: Publish images

# Called from ci.yml for develop and from release.yml for main and tags. The
# cache scope is the same everywhere: a tag can restore Docker layers from the
# default branch but not from an earlier tag.
on:
  workflow_call:

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: Publish ${{ matrix.target }} image
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [api, worker, web]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        env:
          # The build summary stays on the run page; the per-build record
          # artifact is not used and only fills Actions storage.
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ghcr.io/dazegg/voiceroom-${{ matrix.target }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
