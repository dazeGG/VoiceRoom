name: Release Widget

on:
  push:
    tags: ['widget/v*']

jobs:
  release:
    permissions:
      contents: write
      # The reusable workflow includes an image job gated to API and Web.
      packages: write
    uses: ./.github/workflows/release-component.yml
    with:
      component: widget
      url: https://voiceroom.ru/widget/v1/loader.js
    secrets: inherit
