name: Release

# A commit reaches main only through a pull request whose head passed ci.yml while
# up to date with main (branch protection), so nothing here runs those jobs again.
# Keep them out of this workflow: a skipped job would count as passed for that
# protection, on whatever commit it was skipped.
on:
  push:
    # main only keeps the Docker cache warm for the tag that follows.
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  images:
    name: Publish images
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml

  deploy-production:
    name: Deploy production
    needs: images
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      url: https://voiceroom.ru
    secrets: inherit
