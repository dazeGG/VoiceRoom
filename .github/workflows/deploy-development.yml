name: Deploy development hotfix

on:
  push:
    branches: [develop]

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-development-hotfix
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy tested LiveKit fix to dev
    if: "${{ startsWith(github.event.head_commit.message, 'chore(dev): deploy ') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Wait for CI on the exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ci_sha="$GITHUB_SHA"
          mapfile -t changed_files < <(gh api \
            "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" \
            --jq '.files[].filename')
          if [[ "${#changed_files[@]}" -eq 1 && "${changed_files[0]}" == ".github/workflows/deploy-development.yml" ]]; then
            ci_sha="$(gh api \
              "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" \
              --jq '.parents[0].sha')"
          fi
          run_id=""
          for _ in {1..60}; do
            run_id="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow ci.yml \
              --commit "$ci_sha" \
              --event push \
              --limit 10 \
              --json databaseId \
              --jq '.[0].databaseId // empty')"
            if [[ -n "$run_id" ]]; then
              break
            fi
            sleep 5
          done
          if [[ -z "$run_id" ]]; then
            echo "CI run for $ci_sha was not found" >&2
            exit 1
          fi
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Build and roll out the exact Web revision
        uses: appleboy/ssh-action@v1.2.5
        env:
          TARGET_SHA: ${{ github.sha }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/home/daze/VoiceRoom' }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          fingerprint: SHA256:w4iMQ1OwPjO34Vb5ahvBxgfzYvY2/mdYKVCMuGKLbSw
          command_timeout: 30m
          envs: TARGET_SHA,DEPLOY_PATH
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"

            git fetch origin develop
            fetched_sha="$(git rev-parse origin/develop)"
            if [[ "$fetched_sha" != "$TARGET_SHA" ]]; then
              echo "origin/develop is $fetched_sha, expected $TARGET_SHA" >&2
              exit 1
            fi

            api_id="$(docker compose ps -q api)"
            web_id="$(docker compose ps -q caddy)"
            if [[ -z "$api_id" || -z "$web_id" ]]; then
              echo "The current API or Web container is missing" >&2
              docker compose ps
              exit 1
            fi

            old_api_image="$(docker inspect --format '{{.Config.Image}}' "$api_id")"
            old_web_image="$(docker inspect --format '{{.Config.Image}}' "$web_id")"
            project_name="$(docker inspect --format '{{index .Config.Labels "com.docker.compose.project"}}' "$web_id")"
            if [[ -z "$project_name" ]]; then
              echo "The current Web container has no Compose project label" >&2
              exit 1
            fi

            worktree_root="$(mktemp -d /tmp/voiceroom-livekit-deploy.XXXXXX)"
            source_dir="$worktree_root/source"
            cleanup() {
              git worktree remove --force "$source_dir" >/dev/null 2>&1 || true
              rmdir "$worktree_root" >/dev/null 2>&1 || true
            }
            trap cleanup EXIT
            git worktree add --detach "$source_dir" "$TARGET_SHA"

            new_web_image="voiceroom-web:dev-$TARGET_SHA"
            docker build --target web --label "org.opencontainers.image.revision=$TARGET_SHA" --tag "$new_web_image" "$source_dir"

            compose_up_web() {
              local web_image="$1"
              env \
                POSTGRES_PASSWORD=unused-for-web-only-rollout \
                LIVEKIT_GATE_SECRET=unused-for-web-only-rollout \
                VOICE_ROOM_CURSOR_HMAC_KEYS=unused-for-web-only-rollout \
                LIVEKIT_API_KEY=unused-for-web-only-rollout \
                LIVEKIT_API_SECRET=unused-for-web-only-rollout \
                VOICEROOM_API_IMAGE="$old_api_image" \
                VOICEROOM_WORKER_IMAGE="$old_api_image" \
                VOICEROOM_WEB_IMAGE="$web_image" \
                docker compose \
                  --project-name "$project_name" \
                  --project-directory "$DEPLOY_PATH" \
                  --env-file "$DEPLOY_PATH/.env" \
                  -f "$source_dir/docker-compose.yml" \
                  up -d --no-deps --wait --wait-timeout 180 caddy
            }

            rollback() {
              echo "Deployment failed; restoring the previous Web image" >&2
              compose_up_web "$old_web_image" || true
            }
            trap rollback ERR

            compose_up_web "$new_web_image"

            deployed_web_id="$(docker ps \
              --filter "label=com.docker.compose.project=$project_name" \
              --filter 'label=com.docker.compose.service=caddy' \
              --quiet)"
            test -n "$deployed_web_id"
            deployed_web_image="$(docker inspect --format '{{.Config.Image}}' "$deployed_web_id")"
            echo "Expected Web image: $new_web_image"
            echo "Running Web image:  $deployed_web_image"
            test "$deployed_web_image" = "$new_web_image"
            docker exec "$deployed_web_id" grep --fixed-strings --quiet \
              'wss://{$LIVEKIT_DOMAIN}' /etc/caddy/Caddyfile

            curl --fail --silent --show-error --noproxy '*' \
              --resolve dev.voiceroom.ru:443:127.0.0.1 \
              --head https://dev.voiceroom.ru \
              | grep --fixed-strings --quiet 'wss://livekit.dev.voiceroom.ru'

            trap - ERR

            next_env="$(mktemp "$DEPLOY_PATH/.env.next.XXXXXX")"
            awk -v image="$new_web_image" '
              BEGIN { updated = 0 }
              /^VOICEROOM_WEB_IMAGE=/ {
                print "VOICEROOM_WEB_IMAGE=" image
                updated = 1
                next
              }
              { print }
              END {
                if (!updated) print "VOICEROOM_WEB_IMAGE=" image
              }
            ' "$DEPLOY_PATH/.env" >"$next_env"
            chmod --reference="$DEPLOY_PATH/.env" "$next_env"
            mv "$next_env" "$DEPLOY_PATH/.env"
            echo "Deployed Web $TARGET_SHA to dev.voiceroom.ru"

      - name: Verify the public dev endpoints
        shell: bash
        run: |
          set -euo pipefail
          headers=""
          for _ in {1..30}; do
            headers="$(curl --fail --silent --show-error --head https://dev.voiceroom.ru || true)"
            if grep --fixed-strings --quiet 'wss://livekit.dev.voiceroom.ru' <<<"$headers"; then
              break
            fi
            sleep 2
          done
          grep --fixed-strings 'wss://livekit.dev.voiceroom.ru' <<<"$headers"
          curl --fail --silent --show-error https://dev.voiceroom.ru/api/healthz >/dev/null
          curl --fail --silent --show-error https://livekit.dev.voiceroom.ru/readyz >/dev/null
