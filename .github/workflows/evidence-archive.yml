name: Durable release evidence archive

on:
  push:
    branches:
      - feature/2.5.0-g03-durable-evidence-archive
  workflow_dispatch:
    inputs:
      confirm:
        description: Type ARCHIVE-G01-G02 to authorize the first append-only package publication
        required: true
        type: string

concurrency:
  group: release-2.5.0-evidence-archive
  cancel-in-progress: false

jobs:
  authenticate-external-lineage:
    name: Authenticate selection, ancestor and G01/G02 phase chain
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.repository == 'dazeGG/VoiceRoom' && github.ref == 'refs/heads/feature/2.5.0-g03-durable-evidence-archive' && github.actor == 'dazeGG')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      TERMINAL_DEVELOP_SHA: aba5cbf2bca7cc87df843a85be28e8998b4c103b
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Download immutable sources and authenticate every binding
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p authenticated
          node - <<'NODE'
          const fs=require('node:fs');
          const rows=[
            [8442115507,'bootstrap-selection.g01-recovery-a27.json',1],
            [8440954961,'bootstrap-failure.g01-a19.json',1],
            [8442073415,'ci-bundle.bootstrap-recovery-a27.json',1],
            [8442092232,'approval-envelope.bootstrap-recovery-a27.json',1],
            [8442112379,'merge-envelope.bootstrap-recovery-a27.json',1],
            [8443091525,'ci-bundle.g02.json',5],
            [8443117999,'approval-envelope.g02.json',5],
            [8443130578,'merge-envelope.g02.json',1],
          ]; fs.writeFileSync('authenticated/source-plan.json',JSON.stringify(rows));
          NODE
          while IFS=$'	' read -r artifact_id object_id run_attempt; do
            mkdir -p "authenticated/$artifact_id/extracted"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" > "authenticated/$artifact_id/metadata.json"
            run_id="$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1])).workflow_run.id' "authenticated/$artifact_id/metadata.json")"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > "authenticated/$artifact_id/run.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "authenticated/$artifact_id/source.zip"
            test "sha256:$(sha256sum "authenticated/$artifact_id/source.zip" | cut -d' ' -f1)" = "$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1])).digest' "authenticated/$artifact_id/metadata.json")"
            unzip -q "authenticated/$artifact_id/source.zip" -d "authenticated/$artifact_id/extracted"
            test -f "authenticated/$artifact_id/extracted/$object_id"
          done < <(node -e 'for(const x of JSON.parse(require("node:fs").readFileSync("authenticated/source-plan.json")))console.log(x.join("\t"))')
          node - <<'NODE'
          const fs=require('node:fs'),rows=JSON.parse(fs.readFileSync('authenticated/source-plan.json'));
          fs.writeFileSync('authenticated/sources.json',JSON.stringify(rows.map(([artifactId,objectId,runAttempt])=>({artifactId,runAttempt,path:`authenticated/${artifactId}/extracted/${objectId}`,metadataPath:`authenticated/${artifactId}/metadata.json`,runPath:`authenticated/${artifactId}/run.json`}))));
          NODE
          test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/develop --jq .object.sha)" = "$TERMINAL_DEVELOP_SHA"
          node scripts/evidence/archive-to-oci.mjs --validate-sources --sources authenticated/sources.json --terminal-develop-sha "$TERMINAL_DEVELOP_SHA" > authenticated/lineage-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: g03-authenticated-lineage-${{ github.run_id }}-${{ github.run_attempt }}
          path: authenticated/
          if-no-files-found: error
          retention-days: 90

  goal-g03-evidence-archive:
    needs: authenticate-external-lineage
    name: G03 publish ${{ matrix.objectId }} by digest
    if: github.event_name == 'workflow_dispatch' && github.repository == 'dazeGG/VoiceRoom' && inputs.confirm == 'ARCHIVE-G01-G02'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        include:
          - { artifactId: 8442115507, objectId: bootstrap-selection.g01-recovery-a27.json }
          - { artifactId: 8440954961, objectId: bootstrap-failure.g01-a19.json }
          - { artifactId: 8442073415, objectId: ci-bundle.bootstrap-recovery-a27.json }
          - { artifactId: 8442092232, objectId: approval-envelope.bootstrap-recovery-a27.json }
          - { artifactId: 8442112379, objectId: merge-envelope.bootstrap-recovery-a27.json }
          - { artifactId: 8443091525, objectId: ci-bundle.g02.json }
          - { artifactId: 8443117999, objectId: approval-envelope.g02.json }
          - { artifactId: 8443130578, objectId: merge-envelope.g02.json }
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      PACKAGE: ghcr.io/dazegg/voiceroom-release-evidence
      TERMINAL_DEVELOP_SHA: aba5cbf2bca7cc87df843a85be28e8998b4c103b
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v4
        with:
          name: g03-authenticated-lineage-${{ github.run_id }}-${{ github.run_attempt }}
          path: authenticated-source
      - name: Consume the authenticated immutable source and separately re-check terminal develop
        id: source
        shell: bash
        env:
          ARTIFACT_ID: ${{ matrix.artifactId }}
          OBJECT_ID: ${{ matrix.objectId }}
        run: |
          set -euo pipefail
          mkdir -p source extracted
          cp "authenticated-source/$ARTIFACT_ID/metadata.json" source/metadata.json
          cp "authenticated-source/$ARTIFACT_ID/run.json" source/run.json
          cp "authenticated-source/$ARTIFACT_ID/extracted/$OBJECT_ID" "extracted/$OBJECT_ID"
          test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/develop --jq .object.sha)" = "$TERMINAL_DEVELOP_SHA"
          run_id="$(node -p 'JSON.parse(require("node:fs").readFileSync("source/metadata.json")).workflow_run.id')"
          source_sha="$(node -p 'JSON.parse(require("node:fs").readFileSync("source/run.json")).head_sha')"
          run_attempt="$(node -p 'JSON.parse(require("node:fs").readFileSync("source/run.json")).run_attempt')"
          printf 'run-id=%s\nrun-attempt=%s\nsource-sha=%s\n' "$run_id" "$run_attempt" "$source_sha" >> "$GITHUB_OUTPUT"
      - name: Prepare exact compact OCI object
        id: prepare
        env:
          ARTIFACT_ID: ${{ matrix.artifactId }}
          OBJECT_ID: ${{ matrix.objectId }}
          RUN_ID: ${{ steps.source.outputs.run-id }}
          RUN_ATTEMPT: ${{ steps.source.outputs.run-attempt }}
          SOURCE_SHA: ${{ steps.source.outputs.source-sha }}
        run: |
          node scripts/evidence/archive-to-oci.mjs --prepare \
            --source "extracted/$OBJECT_ID" --object-id "$OBJECT_ID" \
            --source-sha "$SOURCE_SHA" --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT" \
            --artifact-id "$ARTIFACT_ID" --output prepared
      - name: Log in with the repository GITHUB_TOKEN only
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish config, re-prove linkage, publish layer and manifest, then fetch by digest
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          scripts/ci/run-oras.sh blob push --media-type application/vnd.oci.empty.v1+json --descriptor \
            "$PACKAGE@${{ steps.prepare.outputs.config-digest }}" prepared/config.json
          gh api /users/dazeGG/packages/container/voiceroom-release-evidence > package.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > archive-run.json
          node - <<'NODE'
          const fs=require('node:fs'),p=JSON.parse(fs.readFileSync('package.json')),r=JSON.parse(fs.readFileSync('archive-run.json')),repos=p.repository?[p.repository]:p.repositories??[];
          if(repos.length!==1) throw new Error('package must have exactly one linked repository');
          const report={owner:p.owner?.login??p.namespace,visibility:p.visibility,linkedRepository:repos[0]?.full_name,actor:r.actor?.login};
          fs.writeFileSync('linkage-report.json',JSON.stringify(report));
          NODE
          node scripts/evidence/check-archive-sentinel.mjs --linkage-report linkage-report.json
          scripts/ci/run-oras.sh blob push --media-type application/json --descriptor \
            "$PACKAGE@${{ steps.prepare.outputs.layer-digest }}" prepared/layer.json
          digest="${{ steps.prepare.outputs.manifest-digest }}"
          scripts/ci/run-oras.sh manifest push --media-type application/vnd.oci.image.manifest.v1+json --descriptor "$PACKAGE@$digest" prepared/manifest.json
          scripts/ci/run-oras.sh manifest fetch --output fetched-manifest.json "$PACKAGE@$digest"
          cmp prepared/manifest.json fetched-manifest.json
          scripts/ci/run-oras.sh blob fetch --output fetched-layer.json "$PACKAGE@${{ steps.prepare.outputs.layer-digest }}"
          cmp prepared/layer.json fetched-layer.json
          printf 'manifest-digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Attest the manifest digest
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6
        with:
          subject-name: ${{ env.PACKAGE }}
          subject-digest: ${{ steps.publish.outputs.manifest-digest }}
          push-to-registry: true
      - name: Verify attestation, add a never-reused discovery tag, and emit ledger proof last
        env:
          DIGEST: ${{ steps.publish.outputs.manifest-digest }}
          TAG: ${{ steps.prepare.outputs.discovery-tag }}
        run: |
          set -euo pipefail
          gh attestation verify "oci://$PACKAGE@$DIGEST" --repo "$GITHUB_REPOSITORY"
          scripts/ci/run-oras.sh tag "$PACKAGE@$DIGEST" "$TAG"
          test "$(scripts/ci/run-oras.sh resolve "$PACKAGE:$TAG")" = "$DIGEST"
          node - <<'NODE'
          const fs=require('node:fs'),o=JSON.parse(fs.readFileSync('prepared/object.json')),l=JSON.parse(fs.readFileSync('linkage-report.json'));
          const crypto=require('node:crypto'),d=p=>`sha256:${crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex')}`;
          const proof={...o,...l,packageOwner:l.owner,packageVisibility:l.visibility,linkedRepository:l.linkedRepository,actor:l.actor,fetchedManifestDigest:d('fetched-manifest.json'),fetchedLayerDigest:d('fetched-layer.json'),attestationVerified:true,tagResolvedDigest:o.manifestDigest,publishedAt:new Date().toISOString()};
          fs.writeFileSync('archive-proof.json',JSON.stringify(proof));
          NODE
          node scripts/evidence/archive-to-oci.mjs --record --proof archive-proof.json \
            --map docs/releases/2.5.0/evidence/archive-map.json \
            --ledger docs/releases/2.5.0/evidence/archive-ledger.json --output archive-state
      - uses: actions/upload-artifact@v4
        with:
          name: g03-archive-proof-${{ matrix.artifactId }}
          path: |
            archive-proof.json
            archive-state/
          if-no-files-found: error
          retention-days: 90

  aggregate-archive-ledger:
    name: Aggregate all eight append-only proofs
    needs: goal-g03-evidence-archive
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: g03-archive-proof-*
          path: proofs
      - name: Require and aggregate the complete deterministic lineage
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs'),path=require('node:path');
          const expected=['bootstrap-selection.g01-recovery-a27.json','bootstrap-failure.g01-a19.json','ci-bundle.bootstrap-recovery-a27.json','approval-envelope.bootstrap-recovery-a27.json','merge-envelope.bootstrap-recovery-a27.json','ci-bundle.g02.json','approval-envelope.g02.json','merge-envelope.g02.json'];
          const files=[];for(const d of fs.readdirSync('proofs')){const p=path.join('proofs',d,'archive-proof.json');if(fs.existsSync(p))files.push(p)}
          const proofs=files.map(p=>JSON.parse(fs.readFileSync(p))); if(proofs.length!==expected.length)throw new Error('all eight archive proofs are required');
          fs.writeFileSync('proofs.json',JSON.stringify(proofs));fs.writeFileSync('expected.json',JSON.stringify(expected));
          NODE
          node scripts/evidence/archive-to-oci.mjs --record-batch --proofs proofs.json --expected expected.json --map docs/releases/2.5.0/evidence/archive-map.json --ledger docs/releases/2.5.0/evidence/archive-ledger.json --output archive-state
      - uses: actions/upload-artifact@v4
        with:
          name: g03-complete-archive-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: archive-state/
          if-no-files-found: error
          retention-days: 90
