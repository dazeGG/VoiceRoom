name: Deploy

# Called from ci.yml for develop and from API/Web tag workflows after image publication.
# Each environment carries its own SSH_HOST / SSH_USER / SSH_KEY secrets and
# DEPLOY_PATH / SSH_FINGERPRINT variables.
on:
  workflow_call:
    inputs:
      component:
        type: string
        default: all
      environment:
        required: true
        type: string
      url:
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Roll out to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.url }}
    # One rollout per environment at a time; never cancel one that has started.
    concurrency:
      group: deploy-${{ inputs.environment }}
      queue: max
    env:
      IMAGE_PREFIX: ghcr.io/dazegg/voiceroom
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Trust the deploy host
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_FINGERPRINT: ${{ vars.SSH_FINGERPRINT }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -T 15 -t ed25519 "$SSH_HOST" > ~/.ssh/known_hosts 2>/dev/null
          actual="$(ssh-keygen -lf ~/.ssh/known_hosts | awk '{print $2}')"
          if [ -z "$SSH_FINGERPRINT" ] || [ "$actual" != "$SSH_FINGERPRINT" ]; then
            echo "::error::host key '$actual' does not match SSH_FINGERPRINT of the ${{ inputs.environment }} environment"
            exit 1
          fi

      - name: Roll out images
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          COMPONENT: ${{ inputs.component }}
          REQUIRE_PERSISTENT_LOGS: ${{ inputs.environment == 'production' && '1' || '0' }}
        shell: bash
        run: |
          set -euo pipefail
          : "${DEPLOY_PATH:?set DEPLOY_PATH on the ${{ inputs.environment }} environment}"
          key="$RUNNER_TEMP/deploy_key"
          install -m 600 /dev/null "$key"
          printf '%s\n' "$SSH_KEY" > "$key"
          api_image="$IMAGE_PREFIX-api:$GITHUB_SHA"
          args="$(printf '%q ' "$DEPLOY_PATH" "$GITHUB_SHA" \
            "$api_image" "$api_image" "$IMAGE_PREFIX-web:$GITHUB_SHA" "$COMPONENT")"
          ssh -i "$key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            "$SSH_USER@$SSH_HOST" "env REQUIRE_PERSISTENT_LOGS=$REQUIRE_PERSISTENT_LOGS bash -s -- $args" < scripts/cd/remote-deploy.sh | tee "$RUNNER_TEMP/rollout.log"
          # A rollout that stops early can still exit 0; only the final marker counts.
          if ! grep -qx "deployed $GITHUB_SHA" "$RUNNER_TEMP/rollout.log"; then
            echo "::error::the rollout ended without reporting 'deployed $GITHUB_SHA'"
            exit 1
          fi

      - name: Check the public release endpoint
        env:
          PUBLIC_URL: ${{ inputs.component == 'all' && format('{0}/api/healthz', inputs.url) || inputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          for _ in {1..12}; do
            if curl -fsSL --max-time 10 -o /dev/null -- "$PUBLIC_URL"; then
              echo
              exit 0
            fi
            sleep 5
          done
          echo "::error::$PUBLIC_URL did not answer after the rollout"
          exit 1
