name: Build static component

on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
      check-publication:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: 1
      COMPONENT: ${{ inputs.component }}
    steps:
      - name: Validate component
        run: |
          case "$COMPONENT" in site|docs) ;; *) exit 1 ;; esac
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: ${{ inputs.component == 'docs' && 'apps/docs/.nvmrc' || '.nvmrc' }}
          cache: npm
          cache-dependency-path: ${{ inputs.component == 'docs' && 'apps/docs/package-lock.json' || 'package-lock.json' }}
      - name: Check static publication
        if: inputs.check-publication
        run: bash scripts/test/static-publication.sh
      - name: Check and build the public site
        if: inputs.component == 'site'
        run: |
          npm ci
          npm run check:site
          npm --workspace @voiceroom/site run build
          node scripts/test/web-text-contrast.test.mts --site
      - name: Check and build documentation
        if: inputs.component == 'docs'
        run: |
          npm --prefix apps/docs ci
          npm --prefix apps/docs run check
          npm --prefix apps/docs run build
      # Node exits successfully on an unmatched --test glob. Require executed
      # workspace tests, not just a green build (or the separate contrast check).
      - name: Test the static workspace
        env:
          NODE_OPTIONS: --test-reporter=tap
        run: |
          set -eo pipefail
          npm --prefix "apps/$COMPONENT" test | tee "$RUNNER_TEMP/static-tests.tap"
          grep -Eq '^# pass [1-9][0-9]*$' "$RUNNER_TEMP/static-tests.tap"
      - uses: actions/upload-artifact@v6
        if: github.event_name != 'pull_request'
        with:
          name: ${{ inputs.component }}-dist
          path: apps/${{ inputs.component }}/dist/
          if-no-files-found: error
          include-hidden-files: true
