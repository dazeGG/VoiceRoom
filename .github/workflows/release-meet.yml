name: Release Meet

on:
  push:
    tags: ['meet/v*']

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/validate-release.yml
    with:
      component: meet

  bundle:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_BUILD_RECORD_UPLOAD: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - uses: docker/setup-buildx-action@v4
        id: buildx
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the Meet API image
        id: api
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          target: api
          platforms: linux/amd64
          push: true
          tags: ghcr.io/dazegg/voiceroom-api:personal-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Publish the Meet edge image
        id: personal-web
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          target: personal-web
          platforms: linux/amd64
          push: true
          # The existing public package lets fresh installs pull anonymously.
          tags: ghcr.io/dazegg/voiceroom-web:personal-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=personal-web
          cache-to: type=gha,mode=max,scope=personal-web
      - name: Pin Compose images and hash release assets
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          PERSONAL_WEB_DIGEST: ${{ steps.personal-web.outputs.digest }}
        run: |
          node scripts/cd/build-personal-release.mts "$GITHUB_REF_NAME" \
            "ghcr.io/dazegg/voiceroom-api@$API_DIGEST" \
            "ghcr.io/dazegg/voiceroom-web@$PERSONAL_WEB_DIGEST" personal-release
      - uses: actions/upload-artifact@v4
        with:
          name: personal-release
          path: personal-release/
          if-no-files-found: error
          overwrite: true

  release:
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-personal-release
      queue: max
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          name: personal-release
          path: personal-release
      - name: Publish installer assets and release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/cd/publish-personal-release.sh "$GITHUB_REF_NAME" personal-release
