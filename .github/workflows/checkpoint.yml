name: Release checkpoint

on:
  workflow_dispatch:
    inputs:
      checkpoint:
        description: Checkpoint to verify
        required: true
        type: choice
        options: [messaging, membership, engagement, media, activation]
      evidence_file:
        description: Repository-relative immutable checkpoint JSON
        required: true
        type: string

permissions:
  contents: read

jobs:
  messaging:
    if: inputs.checkpoint == 'messaging'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node scripts/test/g42-messaging-checkpoint.test.mjs --verify
      - run: node scripts/checkpoints/messaging.mjs --verify "${{ inputs.evidence_file }}"
  membership:
    if: inputs.checkpoint == 'membership'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node scripts/test/g50-membership-checkpoint.test.mjs --verify
      - run: node scripts/checkpoints/membership.mjs --verify "${{ inputs.evidence_file }}"
  engagement:
    if: inputs.checkpoint == 'engagement'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node scripts/test/g71-engagement-checkpoint.test.mjs --verify
      - run: node scripts/checkpoints/engagement.mjs --verify "${{ inputs.evidence_file }}"
  media:
    if: inputs.checkpoint == 'media'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node --test scripts/test/g89-restore.test.mjs scripts/test/g90-media-checkpoint.test.mjs
      - run: node scripts/checkpoints/media.mjs --verify "${{ inputs.evidence_file }}"
  activation:
    if: inputs.checkpoint == 'activation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: node --test scripts/test/g92-activation-matrix.test.mjs
      - run: node scripts/checkpoints/g92-activation-matrix.mjs --manifest config/capability-dag.v1.json --verify "${{ inputs.evidence_file }}"
