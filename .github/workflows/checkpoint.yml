name: Release checkpoint

on:
  workflow_dispatch:
    inputs:
      checkpoint:
        description: Checkpoint to verify
        required: true
        type: choice
        options: [messaging]
      evidence_file:
        description: Repository-relative immutable checkpoint JSON
        required: true
        type: string

permissions:
  contents: read

jobs:
  messaging:
    if: inputs.checkpoint == 'messaging'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node scripts/test/g42-messaging-checkpoint.test.mjs --verify
      - run: node scripts/checkpoints/messaging.mjs --verify "${{ inputs.evidence_file }}"
