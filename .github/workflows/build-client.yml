name: Build client artifacts

on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: ${{ inputs.component == 'all' && fromJSON('["admin","widget"]') || fromJSON(format('["{0}"]', inputs.component)) }}
    env:
      DOCKER_BUILD_RECORD_UPLOAD: false
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.component }}
          outputs: type=local,dest=client-artifact
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.component }}-dist
          path: client-artifact/dist/
          if-no-files-found: error
