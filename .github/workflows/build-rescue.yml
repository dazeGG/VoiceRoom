name: Build expiry-aware rescue image

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: Dockerfile
          push: false
          tags: voice-room-api:2.5.0-expiry-aware-rescue
          outputs: type=oci,dest=${{ runner.temp }}/voice-room-rescue.tar
      - name: Record locally built digest
        run: |
          printf '%s\n' '${{ steps.build.outputs.digest }}' > '${{ runner.temp }}/rescue-digest.txt'
      - uses: actions/upload-artifact@v4
        with:
          name: expiry-aware-rescue-${{ github.sha }}
          path: |
            ${{ runner.temp }}/voice-room-rescue.tar
            ${{ runner.temp }}/rescue-digest.txt
          if-no-files-found: error
          retention-days: 14
