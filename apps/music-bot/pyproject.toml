[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voiceroom-music-bot"
version = "0.1.0"
description = "VoiceRoom shared-music bot: resolves VK/Rutube/YouTube links and publishes audio into a LiveKit room."
requires-python = ">=3.11"
dependencies = [
  "aiohttp==3.14.3",
  "livekit==1.0.16",
  # The one pin here that goes stale by design: yt-dlp's extractors track sites
  # that change without notice, so a pin that works today resolves nothing in a
  # few months. Bump it deliberately rather than treating a VK or YouTube
  # breakage as a bug in this service. See README.md.
  "yt-dlp==2026.8.19",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.5",
]

[project.scripts]
voiceroom-music-bot = "music_bot.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "RUF", "BLE", "SLF", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Test doubles legitimately poke at their own internals, and the fake streams
# deliberately busy-poll instead of modelling a real readiness event.
"tests/*" = ["SLF001", "ASYNC109", "ASYNC110"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error::DeprecationWarning:music_bot.*"]
