services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-voice_room}
      POSTGRES_USER: ${POSTGRES_USER:-voice_room}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-voice_room}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-voice_room}}
      LIVEKIT_URL: ${LIVEKIT_URL:-wss://${LIVEKIT_DOMAIN:-livekit.${DOMAIN}}}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in .env}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in .env}
      LIVEKIT_TOKEN_TTL_SECONDS: ${LIVEKIT_TOKEN_TTL_SECONDS:-21600}
      LIVEKIT_ROOM_PREFIX: ${LIVEKIT_ROOM_PREFIX:-voice-room-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      MAX_ROOM_PEERS: ${MAX_ROOM_PEERS:-12}
      MAX_ROOMS: ${MAX_ROOMS:-100}
      MAX_EMPTY_ROOMS_PER_IP: ${MAX_EMPTY_ROOMS_PER_IP:-3}
      ROOM_CREATE_POW_DIFFICULTY: ${ROOM_CREATE_POW_DIFFICULTY:-14}
      ROOM_CREATE_POW_TTL_MS: ${ROOM_CREATE_POW_TTL_MS:-120000}
      ROOM_CREATE_RATE_LIMIT: ${ROOM_CREATE_RATE_LIMIT:-20}
      ROOM_CREATE_RATE_WINDOW_MS: ${ROOM_CREATE_RATE_WINDOW_MS:-60000}
      ROOM_CHAT_TTL_MS: ${ROOM_CHAT_TTL_MS:-604800000}
      ROOM_CHAT_MAX_MESSAGES: ${ROOM_CHAT_MAX_MESSAGES:-500}
      ROOM_CHAT_RATE_LIMIT: ${ROOM_CHAT_RATE_LIMIT:-60}
      ROOM_CHAT_RATE_WINDOW_MS: ${ROOM_CHAT_RATE_WINDOW_MS:-60000}
      DM_RATE_LIMIT: ${DM_RATE_LIMIT:-30}
      DM_RATE_WINDOW_MS: ${DM_RATE_WINDOW_MS:-10000}
      FRIEND_REQUEST_RATE_LIMIT: ${FRIEND_REQUEST_RATE_LIMIT:-20}
      FRIEND_REQUEST_RATE_WINDOW_MS: ${FRIEND_REQUEST_RATE_WINDOW_MS:-60000}
      AVATAR_UPLOAD_RATE_LIMIT: ${AVATAR_UPLOAD_RATE_LIMIT:-10}
      AVATAR_UPLOAD_RATE_WINDOW_MS: ${AVATAR_UPLOAD_RATE_WINDOW_MS:-60000}
      MAX_REALTIME_STREAMS_PER_USER: ${MAX_REALTIME_STREAMS_PER_USER:-8}
      MAX_GUEST_STREAMS_PER_IP: ${MAX_GUEST_STREAMS_PER_IP:-8}
      WS_MAX_PAYLOAD_BYTES: ${WS_MAX_PAYLOAD_BYTES:-65536}
      RETENTION_PURGE_INTERVAL_MS: ${RETENTION_PURGE_INTERVAL_MS:-3600000}
      RETENTION_KEEP_DELETED_MS: ${RETENTION_KEEP_DELETED_MS:-2592000000}
      POW_SECRET: ${POW_SECRET:-}
      UPLOADS_DIR: /data/uploads
    expose:
      - "3000"
    volumes:
      - uploads:/data/uploads
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  caddy:
    build:
      context: .
      target: web
      args:
        DOMAIN: ${DOMAIN:?set DOMAIN in .env}
        LIVEKIT_DOMAIN: ${LIVEKIT_DOMAIN:-livekit.${DOMAIN}}
        LIVEKIT_URL: ${LIVEKIT_URL:-wss://${LIVEKIT_DOMAIN:-livekit.${DOMAIN}}}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      livekit:
        condition: service_started
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      LIVEKIT_DOMAIN: ${LIVEKIT_DOMAIN:-livekit.${DOMAIN}}
      API_METRICS_ALLOWED_REMOTE: ${API_METRICS_ALLOWED_REMOTE:-127.0.0.1}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

  livekit:
    image: ${LIVEKIT_IMAGE:-livekit/livekit-server:v1.13.2}
    restart: unless-stopped
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        bind_addresses:
          - 0.0.0.0
        log_level: info
        prometheus_port: ${LIVEKIT_METRICS_PORT:-6789}
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: true
        keys:
          "${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in .env}": "${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in .env}"
    expose:
      - "7880"
      - "${LIVEKIT_METRICS_PORT:-6789}"
    ports:
      - "${LIVEKIT_METRICS_BIND_ADDRESS:-127.0.0.1}:${LIVEKIT_METRICS_PORT:-6789}:${LIVEKIT_METRICS_PORT:-6789}"
      - "7881:7881/tcp"
      - "7882:7882/udp"

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  uploads:
