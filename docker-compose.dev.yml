services:
  deps:
    build:
      context: .
      target: deps
    command: npm install
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - api_node_modules:/app/apps/api/node_modules
      - web_node_modules:/app/apps/web/node_modules
      - shared_node_modules:/app/packages/shared/node_modules

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-voice_room_dev}
      POSTGRES_USER: ${POSTGRES_USER:-voice_room}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voice_room_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      target: deps
    command: npm --workspace @voice-room/api run dev
    working_dir: /app
    depends_on:
      deps:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      livekit:
        condition: service_started
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-voice_room}:${POSTGRES_PASSWORD:-voice_room_dev}@postgres:5432/${POSTGRES_DB:-voice_room_dev}}
      LIVEKIT_URL: ${LIVEKIT_PUBLIC_URL:-ws://localhost:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-devsecret}
      ROOM_CREATE_POW_DIFFICULTY: ${ROOM_CREATE_POW_DIFFICULTY:-0}
      ROOM_CREATE_RATE_LIMIT: ${ROOM_CREATE_RATE_LIMIT:-0}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      MAX_GUEST_STREAMS_PER_IP: ${MAX_GUEST_STREAMS_PER_IP:-8}
      WS_MAX_PAYLOAD_BYTES: ${WS_MAX_PAYLOAD_BYTES:-65536}
      RETENTION_PURGE_INTERVAL_MS: ${RETENTION_PURGE_INTERVAL_MS:-3600000}
      RETENTION_KEEP_DELETED_MS: ${RETENTION_KEEP_DELETED_MS:-2592000000}
      POW_SECRET: ${POW_SECRET:-}
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - api_node_modules:/app/apps/api/node_modules
      - web_node_modules:/app/apps/web/node_modules
      - shared_node_modules:/app/packages/shared/node_modules

  web:
    build:
      context: .
      target: deps
    command: npm --workspace @voice-room/web run dev
    working_dir: /app
    depends_on:
      deps:
        condition: service_completed_successfully
      api:
        condition: service_started
    environment:
      VITE_DEV_HOST: 0.0.0.0
      VITE_DEV_API_TARGET: http://api:3000
    ports:
      - "${WEB_PORT:-5180}:5180"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - api_node_modules:/app/apps/api/node_modules
      - web_node_modules:/app/apps/web/node_modules
      - shared_node_modules:/app/packages/shared/node_modules

  livekit:
    image: ${LIVEKIT_IMAGE:-livekit/livekit-server:v1.13.2}
    command: --dev --bind 0.0.0.0
    environment:
      # Keep the server's key/secret in lockstep with the API (which signs the
      # tokens) so dev voice works without a .env. Both read the same vars, so
      # they always match. Without explicit keys `--dev` falls back to
      # devkey/secret and the API's devsecret tokens would be rejected.
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-devsecret}"
    ports:
      - "${LIVEKIT_HTTP_PORT:-7880}:7880"
      - "${LIVEKIT_TCP_PORT:-7881}:7881"
      - "${LIVEKIT_UDP_PORT:-7882}:7882/udp"

volumes:
  postgres_dev_data:
  node_modules:
  api_node_modules:
  web_node_modules:
  shared_node_modules:
